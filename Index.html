<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Customers Hub</title>

  <?!= include('CSS'); ?>

</head>


<body>


<!-- =========================================
     TOP HEADER
========================================= -->

<header class="app-header">

  <div
    class="brand home-button"
    id="homeButton"
    title="Home"
  >

    <div class="brand-icon">
      C
    </div>

    <div>

      <div class="brand-title">
        Customers Hub
      </div>

      <div class="brand-subtitle">
        Industrial Areas
      </div>

    </div>

  </div>


  <!-- =======================================
       UNIVERSAL SEARCH
  ======================================== -->

  <div class="universal-search">

    <span class="universal-search-icon">
      🔍
    </span>

    <input
      id="universalSearch"
      type="text"
      placeholder="Search customers, areas or contacts..."
      autocomplete="off"
    >

    <button
      id="universalSearchClear"
      type="button"
      class="universal-search-clear hidden"
      title="Clear search"
    >
      ×
    </button>

    <div
      id="universalSearchResults"
      class="universal-search-results hidden"
    ></div>

  </div>


  <!-- =======================================
       HEADER ACTIONS
  ======================================== -->

  <div class="header-actions">

    <button
      id="openSheetButton"
      class="sheet-button"
      type="button"
    >
      Sheet
    </button>

    <div class="area-count">

      <span id="areaCount">
        0
      </span>

      Industrial Areas

    </div>

  </div>

</header>



<!-- =========================================
     FULL MAP
========================================= -->

<main class="map-container">

  <div
    id="map"
    class="map"
  ></div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading-overlay"
  >
    Loading Industrial Areas...
  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error-overlay hidden"
  ></div>



  <!-- =======================================
       CUSTOMER PANEL
  ======================================== -->

  <aside
    id="customerView"
    class="floating-panel hidden"
  >

    <div class="panel-header">

      <button
        id="backToAreas"
        class="back-button"
        type="button"
      >
        ←
      </button>


      <div class="selected-area-heading">

        <div
          id="selectedAreaName"
          class="panel-title"
        ></div>

        <div
          id="selectedAreaCity"
          class="panel-subtitle"
        ></div>

      </div>

    </div>


    <div
      id="customerLoading"
      class="loading"
    >
      Loading Customers...
    </div>


    <div
      id="customerList"
      class="customer-list"
    ></div>

  </aside>



  <!-- =======================================
       CUSTOMER DETAILS
  ======================================== -->

  <aside
    id="detailView"
    class="floating-panel hidden"
  >

    <div class="panel-header">

      <button
        id="backToCustomers"
        class="back-button"
        type="button"
      >
        ←
      </button>

      <div class="panel-title">
        Customer Details
      </div>

    </div>


    <div
      id="customerDetail"
      class="customer-detail"
    ></div>

  </aside>



  <!-- =======================================
       ALL CUSTOMERS
  ======================================== -->

  <aside
    id="allCustomersView"
    class="floating-panel hidden"
  >

    <div class="panel-header">

      <button
        id="backFromAllCustomers"
        class="back-button"
        type="button"
      >
        ←
      </button>


      <div class="selected-area-heading">

        <div class="panel-title">
          All Customers
        </div>

        <div
          id="allCustomerCount"
          class="panel-subtitle"
        >
          Loading...
        </div>

      </div>

    </div>


    <!-- CUSTOMER SEARCH -->

    <div class="all-customer-search">

      <input
        id="allCustomerSearch"
        type="text"
        placeholder="Search customers..."
        autocomplete="off"
      >

      <button
        id="allCustomerSearchClear"
        type="button"
        class="hidden"
        title="Clear"
      >
        ×
      </button>

    </div>


    <div
      id="allCustomerLoading"
      class="loading"
    >
      Loading Customers...
    </div>


    <div
      id="allCustomerList"
      class="customer-list"
    ></div>

  </aside>

</main>



<?!= include('JS'); ?>


</body>

</html>
