<script>

/*************************************************
 * GLOBAL VARIABLES
 *************************************************/

let map = null;

let hubs = [];
let customers = [];
let markers = [];

let activeHubIndex = -1;
let activeHub = null;
let activeCustomer = null;

let settingsOptions = null;


/*************************************************
 * START APPLICATION
 *************************************************/

window.addEventListener('load', function () {

  bindEvents();
  loadApplication();

});


/*************************************************
 * BIND EVENTS
 *************************************************/

function bindEvents() {

  const backToHubs =
    document.getElementById('backToHubs');

  if (backToHubs) {
    backToHubs.addEventListener(
      'click',
      closeCustomerPanel
    );
  }


  const backToCustomers =
    document.getElementById('backToCustomers');

  if (backToCustomers) {
    backToCustomers.addEventListener(
      'click',
      showCustomerView
    );
  }


  const openSheetButton =
    document.getElementById('openSheetButton');

  if (openSheetButton) {
    openSheetButton.addEventListener(
      'click',
      openSheet
    );
  }


  const homeButton =
    document.getElementById('homeButton');

  if (homeButton) {
    homeButton.addEventListener(
      'click',
      resetHomeView
    );
  }

}


/*************************************************
 * LOAD APPLICATION
 *************************************************/

function loadApplication() {

  showLoading(true);
  hideError();


  google.script.run

    .withSuccessHandler(function (config) {

      if (
        !config ||
        !config.mapApiKey
      ) {

        showLoading(false);

        showError(
          'Google Maps API key was not found.'
        );

        return;

      }


      loadGoogleMaps(
        config.mapApiKey
      );

    })

    .withFailureHandler(function (error) {

      showLoading(false);

      showError(
        getErrorMessage(error)
      );

    })

    .getAppConfig();

}


/*************************************************
 * LOAD GOOGLE MAPS
 *************************************************/

function loadGoogleMaps(apiKey) {

  if (
    window.google &&
    window.google.maps
  ) {

    initializeMap();
    return;

  }


  window.initCustomersHubMap =
    function () {

      initializeMap();

    };


  const script =
    document.createElement('script');


  script.src =
    'https://maps.googleapis.com/maps/api/js' +
    '?key=' +
    encodeURIComponent(apiKey) +
    '&callback=initCustomersHubMap';


  script.async = true;
  script.defer = true;


  script.onerror =
    function () {

      showLoading(false);

      showError(
        'Unable to load Google Maps. ' +
        'Please check your API key and Maps JavaScript API.'
      );

    };


  document.head.appendChild(script);

}


/*************************************************
 * INITIALIZE MAP
 *************************************************/

function initializeMap() {

  map =
    new google.maps.Map(
      document.getElementById('map'),
      {

        center: {
          lat: 12.9716,
          lng: 77.5946
        },

        zoom: 11,

        styles: [

          {
            featureType: 'all',
            elementType: 'labels',
            stylers: [
              {
                visibility: 'off'
              }
            ]
          },

          {
            featureType: 'road',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          },

          {
            featureType: 'administrative',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          },

          {
            featureType: 'landscape',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          },

          {
            featureType: 'water',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          }

        ],

        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        zoomControl: true,
        clickableIcons: false,
        gestureHandling: 'greedy'

      }
    );


  loadHubs();

}


/*************************************************
 * LOAD INDUSTRIAL HUBS
 *************************************************/

function loadHubs() {

  showLoading(true);
  hideError();


  google.script.run

    .withSuccessHandler(function (data) {

      hubs = data || [];


      const count =
        document.getElementById('hubCount');

      if (count) {
        count.textContent =
          hubs.length;
      }


      renderHubMarkers();

      showLoading(false);

    })

    .withFailureHandler(function (error) {

      showLoading(false);

      showError(
        getErrorMessage(error)
      );

    })

    .getIndustrialHubs();

}


/*************************************************
 * RENDER INDUSTRIAL HUB MARKERS
 *************************************************/

function renderHubMarkers() {

  markers.forEach(function (marker) {

    marker.setMap(null);

  });

  markers = [];


  if (!hubs.length) {
    return;
  }


  hubs.forEach(function (hub, index) {

    const position = {

      lat: Number(hub.latitude),

      lng: Number(hub.longitude)

    };


    const name =
      String(hub.hub || '');


    const textWidth =
      Math.max(
        45,
        Math.min(
          150,
          name.length * 7 + 12
        )
      );


    const textHeight = 24;


    /*
     * Transparent clickable area.
     * Only text is visible.
     */

    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" ' +
      'width="' + textWidth + '" ' +
      'height="' + textHeight + '">' +

        '<rect ' +
          'x="0" ' +
          'y="0" ' +
          'width="' + textWidth + '" ' +
          'height="' + textHeight + '" ' +
          'fill="white" ' +
          'fill-opacity="0.01"/>' +

      '</svg>';


    const transparentIcon = {

      url:
        'data:image/svg+xml;charset=UTF-8,' +
        encodeURIComponent(svg),

      scaledSize:
        new google.maps.Size(
          textWidth,
          textHeight
        ),

      anchor:
        new google.maps.Point(
          textWidth / 2,
          textHeight / 2
        )

    };


    const marker =
      new google.maps.Marker({

        position: position,

        map: map,

        title: name,

        icon: transparentIcon,

        label: {

          text: name,

          color: '#202124',

          fontFamily:
            'Roboto, Arial, sans-serif',

          fontSize: '12px',

          fontWeight: '500'

        },

        clickable: true,

        zIndex:
          1000 + index

      });


    marker.addListener(
      'click',
      function () {

        selectHub(index);

      }
    );


    markers.push(marker);

  });


  /*
   * Initial view:
   * Central Bengaluru
   */

  map.setCenter({

    lat: 12.9716,

    lng: 77.5946

  });


  map.setZoom(11);

}


/*************************************************
 * SELECT INDUSTRIAL HUB
 *************************************************/

function selectHub(index) {

  if (
    index < 0 ||
    index >= hubs.length
  ) {
    return;
  }


  activeHubIndex =
    index;

  activeHub =
    hubs[index];


  /*
   * Move map to selected hub.
   */

  if (map) {

    map.panTo({

      lat:
        Number(
          activeHub.latitude
        ),

      lng:
        Number(
          activeHub.longitude
        )

    });

  }


  loadCustomersByHub(
    activeHub.hub
  );

}


/*************************************************
 * LOAD CUSTOMERS BY HUB
 *************************************************/

function loadCustomersByHub(
  hubName
) {

  showCustomerView();


  const loading =
    document.getElementById(
      'customerLoading'
    );


  const list =
    document.getElementById(
      'customerList'
    );


  if (loading) {

    loading.classList.remove(
      'hidden'
    );

  }


  if (list) {

    list.innerHTML = '';

  }


  const selectedHubName =
    document.getElementById(
      'selectedHubName'
    );


  if (selectedHubName) {

    selectedHubName.textContent =
      hubName;

  }


  const selectedHubCity =
    document.getElementById(
      'selectedHubCity'
    );


  if (selectedHubCity) {

    selectedHubCity.textContent =
      activeHub
        ? activeHub.city
        : '';

  }


  google.script.run

    .withSuccessHandler(
      function (data) {

        customers =
          data || [];


        if (loading) {

          loading.classList.add(
            'hidden'
          );

        }


        renderCustomerList();

      }
    )

    .withFailureHandler(
      function (error) {

        if (loading) {

          loading.classList.add(
            'hidden'
          );

        }


        if (list) {

          list.innerHTML =
            '<div class="loading">' +
              escapeHtml(
                getErrorMessage(error)
              ) +
            '</div>';

        }

      }
    )

    .getCustomersByHub(
      hubName
    );

}


/*************************************************
 * RENDER CUSTOMER LIST
 *************************************************/

function renderCustomerList() {

  const list =
    document.getElementById(
      'customerList'
    );


  if (!list) {
    return;
  }


  list.innerHTML = '';


  const selectedHubCity =
    document.getElementById(
      'selectedHubCity'
    );


  if (selectedHubCity) {

    selectedHubCity.textContent =

      (activeHub
        ? activeHub.city
        : '') +

      ' · ' +

      customers.length +

      ' Customers';

  }


  if (!customers.length) {

    list.innerHTML =
      '<div class="loading">' +
        'No customers found in this Industrial Hub.' +
      '</div>';

    return;

  }


  customers.forEach(
    function (
      customer,
      index
    ) {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'customer-item';


      const customerName =
        getField(
          customer,
          [
            'customerName',
            'Customer Name',
            'Company',
            'company'
          ]
        );


      const industrialArea =
        getField(
          customer,
          [
            'industrialArea',
            'Industrial Area'
          ]
        );


      const city =
        getField(
          customer,
          [
            'city',
            'City'
          ]
        );


      item.innerHTML =

        '<div class="customer-name">' +

          escapeHtml(
            customerName || '-'
          ) +

        '</div>' +

        '<div class="customer-area">' +

          'Industrial Area: ' +

          escapeHtml(
            industrialArea || '-'
          ) +

        '</div>' +

        '<div class="customer-city">' +

          escapeHtml(
            city || ''
          ) +

        '</div>';


      item.addEventListener(
        'click',
        function () {

          selectCustomer(index);

        }
      );


      list.appendChild(item);

    }
  );

}


/*************************************************
 * SELECT CUSTOMER
 *************************************************/

function selectCustomer(index) {

  if (
    index < 0 ||
    index >= customers.length
  ) {
    return;
  }


  activeCustomer =
    customers[index];


  renderCustomerDetail();

  showDetailView();


  if (activeHub && map) {

    map.panTo({

      lat:
        Number(
          activeHub.latitude
        ),

      lng:
        Number(
          activeHub.longitude
        )

    });

  }

}


/*************************************************
 * RENDER CUSTOMER DETAILS
 *************************************************/

function renderCustomerDetail() {

  const customer =
    activeCustomer;


  const detail =
    document.getElementById(
      'customerDetail'
    );


  if (!detail) {
    return;
  }


  if (!customer) {

    detail.innerHTML = '';

    return;

  }


  const companyId =
    getField(
      customer,
      [
        'companyId',
        'Company ID',
        'company_id'
      ]
    );


  const customerName =
    getField(
      customer,
      [
        'customerName',
        'Customer Name',
        'customer_name',
        'Company',
        'company'
      ]
    );


  const type =
    getField(
      customer,
      [
        'type',
        'Type'
      ]
    );


  const status =
    getField(
      customer,
      [
        'status',
        'Status'
      ]
    );


  const potential =
    getField(
      customer,
      [
        'potential',
        'Potential'
      ]
    );


  const notes =
    getField(
      customer,
      [
        'notes',
        'Notes'
      ]
    );


  const website =
    getField(
      customer,
      [
        'website',
        'Website'
      ]
    );


  let html = '';


  /*
   * Header
   */

  html +=

    '<div class="detail-header-row">' +

      '<div>' +

        '<div class="detail-company-name">' +
          escapeHtml(
            customerName || '-'
          ) +
        '</div>' +

        '<div class="detail-company-id">' +
          'Company ID: ' +
          escapeHtml(
            companyId || '-'
          ) +
        '</div>' +

      '</div>' +

      '<button ' +
        'class="edit-icon-button" ' +
        'type="button" ' +
        'title="Edit Customer" ' +
        'onclick="openCustomerEdit()">' +
        '✎' +
      '</button>' +

    '</div>';


  /*
   * Customer information
   */


  html +=

  '<div class="customer-info">' +

    customerInfoItem(
      'Type',
      type
    ) +

    customerInfoItem(
      'Status',
      status
    ) +

    customerInfoItem(
      'Potential',
      formatPotential(potential)
    ) +

    customerInfoItem(
      'Notes',
      notes
    ) +

  '</div>';

  /*
   * Website
   */

  if (website) {

    html +=

      '<a class="website-link" ' +

        'href="' +
          escapeAttribute(
            normalizeUrl(website)
          ) +
        '"' +

        'target="_blank">' +

        'Visit Website' +

      '</a>';

  }


  /*
   * People
   */

  html +=

    '<div class="people-heading">' +
      'People' +
    '</div>';


  html +=

    '<div id="peopleList">' +

      '<div class="loading">' +
        'Loading contacts...' +
      '</div>' +

    '</div>';


  detail.innerHTML =
    html;


  loadPeople(companyId);

}


/*************************************************
 * GET FIELD
 *************************************************/

function getField(obj, possibleNames) {

  if (!obj) {
    return '';
  }


  const keys =
    Object.keys(obj);


  for (
    let i = 0;
    i < possibleNames.length;
    i++
  ) {

    const wanted =
      String(
        possibleNames[i]
      )
      .trim()
      .toLowerCase()
      .replace(/[\s_-]+/g, '');


    for (
      let j = 0;
      j < keys.length;
      j++
    ) {

      const actual =
        String(keys[j])
          .trim()
          .toLowerCase()
          .replace(/[\s_-]+/g, '');


      if (actual === wanted) {

        const value =
          obj[keys[j]];


        /*
         * Never display literal
         * undefined / null.
         */

        if (
          value === undefined ||
          value === null
        ) {

          return '';

        }


        return value;

      }

    }

  }


  return '';

}

/*************************************************
 * CUSTOMER INFO ITEM
 *************************************************/

function customerInfoItem(
  label,
  value
) {

  return (

    '<div class="customer-info-item">' +

      '<div class="customer-info-label">' +
        escapeHtml(label) +
      '</div>' +

      '<div class="customer-info-value">' +
        escapeHtml(value || '-') +
      '</div>' +

    '</div>'

  );

}

/*************************************************
 * FORMAT POTENTIAL
 *************************************************/

function formatPotential(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '-';

  }


  const number =
    Number(
      String(value)
        .replace(/,/g, '')
        .replace(/₹/g, '')
    );


  if (!isNaN(number)) {

    return '₹' +
      number.toLocaleString(
        'en-IN'
      );

  }


  return String(value);

}


/*************************************************
 * LOAD PEOPLE
 *************************************************/

function loadPeople(companyId) {

  google.script.run

    .withSuccessHandler(
      function (people) {

        renderPeople(
          people || []
        );

      }
    )

    .withFailureHandler(
      function (error) {

        const container =
          document.getElementById(
            'peopleList'
          );


        if (container) {

          container.innerHTML =

            '<div class="no-contacts">' +

              'Unable to load contact details.' +

            '</div>';

        }

        console.error(error);

      }
    )

    .getPeopleByCompanyId(
      companyId
    );

}


/*************************************************
 * RENDER PEOPLE
 *************************************************/

function renderPeople(
  people
) {

  const container =
    document.getElementById(
      'peopleList'
    );


  if (!container) {
    return;
  }


  if (
    !people ||
    !people.length
  ) {

    container.innerHTML =

      '<div class="no-contacts">' +

        '<div>' +
          'No contact details available.' +
        '</div>' +

        '<button ' +
          'class="add-contact-button" ' +
          'onclick="openPersonEdit(\'\')">' +

          '+ Add Contact' +

        '</button>' +

      '</div>';

    return;

  }


  container.innerHTML = '';


  people.forEach(
    function (person) {

      const name =
        getField(
          person,
          [
            'name',
            'Name'
          ]
        );


      const designation =
        getField(
          person,
          [
            'designation',
            'Designation'
          ]
        );


      const phone =
        getField(
          person,
          [
            'phone',
            'Phone'
          ]
        );


      const email =
        getField(
          person,
          [
            'email',
            'Email'
          ]
        );


      const visitingCard =
        getField(
          person,
          [
            'visitingCardUrl',
            'visitingCard',
            'Visiting Card',
            'photo',
            'Photo'
          ]
        );


      const peopleId =
        getField(
          person,
          [
            'peopleId',
            'People ID'
          ]
        );


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'person-card';


      let html = '';


      html +=

        '<div class="person-header">' +

          '<div class="person-name">' +
            escapeHtml(
              name || '-'
            ) +
          '</div>' +

          '<button ' +
            'class="person-edit-button" ' +
            'title="Edit Contact" ' +
            'onclick="openPersonEdit(\'' +
              escapeAttribute(
                peopleId
              ) +
            '\')">' +

            '✎' +

          '</button>' +

        '</div>';


      if (designation) {

        html +=

          '<div class="person-designation">' +
            escapeHtml(
              designation
            ) +
          '</div>';

      }


      if (phone) {

  html +=

    '<div class="person-row">' +

      '<span class="contact-label">' +
        'Phone:' +
      '</span>' +

      '<span class="contact-value">' +

        '<a href="tel:' +
          escapeAttribute(phone) +
        '">' +

          escapeHtml(phone) +

        '</a>' +

      '</span>' +

    '</div>';

}


      if (email) {

  html +=

    '<div class="person-row">' +

      '<span class="contact-label">' +
        'Email:' +
      '</span>' +

      '<span class="contact-value">' +

        '<a href="mailto:' +
          escapeAttribute(email) +
        '">' +

          escapeHtml(email) +

        '</a>' +

      '</span>' +

    '</div>';

}


      if (visitingCard) {

        html +=

          '<a class="visiting-card" ' +

            'href="' +
              escapeAttribute(
                normalizeUrl(
                  visitingCard
                )
              ) +
            '"' +

            'target="_blank">' +

            'View Visiting Card' +

          '</a>';

      }


      card.innerHTML =
        html;


      container.appendChild(
        card
      );

    }
  );

}


/*************************************************
 * SHOW CUSTOMER VIEW
 *************************************************/

function showCustomerView() {

  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'customerView'
    )
    .classList.remove(
      'hidden'
    );

}


/*************************************************
 * SHOW DETAIL VIEW
 *************************************************/

function showDetailView() {

  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.remove(
      'hidden'
    );

}


/*************************************************
 * CLOSE CUSTOMER PANEL
 *************************************************/

function closeCustomerPanel() {

  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  activeCustomer = null;

}


/*************************************************
 * EDIT CUSTOMER
 *************************************************/

function openCustomerEdit() {

  if (!activeCustomer) {
    return;
  }


  loadSettingsOptions(
    function (options) {

      showCustomerEditForm(
        options
      );

    }
  );

}


/*************************************************
 * CUSTOMER EDIT FORM
 *************************************************/

function showCustomerEditForm(
  options
) {

  const customer =
    activeCustomer;


  const companyId =
    getField(
      customer,
      [
        'companyId',
        'Company ID'
      ]
    );


  const customerName =
    getField(
      customer,
      [
        'customerName',
        'Customer Name',
        'Company'
      ]
    );


  const industrialArea =
    getField(
      customer,
      [
        'industrialArea',
        'Industrial Area'
      ]
    );


  const industrialHub =
    getField(
      customer,
      [
        'industrialHub',
        'Industrial Hub'
      ]
    );


  const city =
    getField(
      customer,
      [
        'city',
        'City'
      ]
    );


  const type =
    getField(
      customer,
      [
        'type',
        'Type'
      ]
    );


  const status =
    getField(
      customer,
      [
        'status',
        'Status'
      ]
    );


  const potential =
    getField(
      customer,
      [
        'potential',
        'Potential'
      ]
    );


  const website =
    getField(
      customer,
      [
        'website',
        'Website'
      ]
    );


  const notes =
    getField(
      customer,
      [
        'notes',
        'Notes'
      ]
    );


  let html = '';


  /*
   * Company ID
   */

  html +=

    '<div class="edit-field">' +

      '<label>Company ID</label>' +

      '<input ' +
        'id="editCompanyId" ' +
        'value="' +
          escapeAttribute(companyId) +
        '"' +
        ' readonly>' +

    '</div>';


  /*
   * Customer Name
   */

  html +=

    '<div class="edit-field">' +

      '<label>Customer Name</label>' +

      '<input ' +
        'id="editCustomerName" ' +
        'value="' +
          escapeAttribute(customerName) +
        '">' +

    '</div>';


  /*
   * Industrial Area
   */

  html += createSelectHtml(

    'editIndustrialArea',

    'Industrial Area',

    options['Industrial Area'],

    industrialArea

  );


  /*
   * Industrial Hub
   */

  html += createSelectHtml(

    'editIndustrialHub',

    'Industrial Hub',

    options['Industrial Hub'],

    industrialHub

  );


  /*
   * City
   */

  html += createSelectHtml(

    'editCity',

    'City',

    options['City'],

    city

  );


  /*
   * Type
   */

  html += createSelectHtml(

    'editType',

    'Type',

    options['Type'],

    type

  );


  /*
   * Status
   */

  html += createSelectHtml(

    'editStatus',

    'Status',

    options['Status'],

/*************************************************
 * EDIT MODAL
 *************************************************/

function openEditModal(
  title,
  content,
  saveFunction
) {

  let modal =
    document.getElementById(
      'editModal'
    );


  if (!modal) {

    modal =
      document.createElement(
        'div'
      );


    modal.id =
      'editModal';


    modal.className =
      'edit-modal';


    document.body.appendChild(
      modal
    );

  }


  modal.innerHTML =

    '<div class="edit-modal-box">' +

      '<div class="edit-modal-header">' +

        '<div class="edit-modal-title">' +
          escapeHtml(title) +
        '</div>' +

        '<button ' +
          'class="modal-close" ' +
          'onclick="closeEditModal()">' +

        '</button>' +

      '</div>' +

      '</div>' +

          'onclick="closeEditModal()">' +

        '<button ' +
          'class="save-button" ' +
          'id="editSaveButton">' +
          'Save' +
        '</button>' +

      '</div>' +

    '</div>';

    .remove('hidden');

    .getElementById(

    .onclick =

 *************************************************/

function closeEditModal() {

  const modal =
    document.getElementById(
      'editModal'
    );

}

function saveCustomer() {

  const companyId =

      .trim();


  const data = {

    customerName:
      document
        .getElementById(
          'editCustomerName'
        )
        .value
        .trim(),

    industrialArea:
      document
        .getElementById(
          'editIndustrialArea'
        )
        .value
        .trim(),

    industrialHub:
      document
        .getElementById(
          'editIndustrialHub'
        )
        .value
        .trim(),

    city:
      document
        .getElementById(
          'editCity'
        )
        .value
        .trim(),

    type:
      document
        .getElementById(
          'editType'
        )
        .value
        .trim(),

    status:
      document
        .getElementById(
          'editStatus'
        )
        .value
        .trim(),

    potential:
      document
        .getElementById(
          'editPotential'
        )
        .value
        .trim(),

    website:
      document
        .getElementById(
          'editWebsite'
        )
        .value
        .trim(),

    notes:
      document
        .getElementById(
          'editNotes'
        )
        .value
        .trim()

  };


  const button =

      'editSaveButton'
    );


  button.disabled = true;

  google.script.run

    .withSuccessHandler(
      function () {

         * Update local customer data
         */

        Object.keys(data).forEach(
          function (key) {

            activeCustomer[key] =
              data[key];

          }
        );


        /*
         * Close modal
         */

        closeEditModal();


        /*
         * Refresh customer details
         */

        refreshCustomerDetails();

      }
    )

    .withFailureHandler(
      function (error) {

        button.disabled =
          false;

        button.textContent =
          'Save';


        alert(
          getErrorMessage(error)
        );

      }
    )

    .updateCustomerRecord(
      companyId,
      data
    );

}


/*************************************************
 * REFRESH CUSTOMER DETAILS
 *************************************************/

function refreshCustomerDetails() {

  if (!activeCustomer) {
    return;
  }


  const companyId =
    getField(
      activeCustomer,
      [
        'companyId',
        'Company ID'
      ]
    );


  /*
   * Reload the selected hub.
   * This makes sure the app has
   * the latest Sheet data.
   */

  if (!activeHub) {

    renderCustomerDetail();

    return;

  }


  google.script.run

    .withSuccessHandler(
      function (data) {

        const updatedCustomers =
          data || [];


        const updated =
          updatedCustomers.find(
            function (customer) {

              const id =
                getField(
                  customer,
                  [
                    'companyId',
                    'Company ID'
                  ]
                );

              return String(id) ===
                String(companyId);

            }
          );


        if (updated) {

          activeCustomer =
            updated;

        }


        customers =
          updatedCustomers;


        renderCustomerDetail();

      }
    )

    .withFailureHandler(
      function () {

        /*
         * If refresh fails,
         * at least show local data.
         */

        renderCustomerDetail();

      }
    )

    .getCustomersByHub(
      activeHub.hub
    );

}

/*************************************************
 * LOAD SETTINGS OPTIONS
 *************************************************/

function loadSettingsOptions(
  callback
) {

  if (settingsOptions) {

    callback(
      settingsOptions
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function (data) {

        settingsOptions =
          data || {};


        callback(
          settingsOptions
        );

      }
    )

    .withFailureHandler(
      function (error) {

        console.error(
          'Settings error:',
          error
        );


        settingsOptions =
          {};


        callback(
          settingsOptions
        );

      }
    )

    .getSettingsOptions();

}


/*************************************************
 * CREATE SELECT
 *************************************************/

function createSelectHtml(
  id,
  label,
  options,
  selectedValue
) {

  options =
    options || [];


  let html =

    '<div class="edit-field">' +

      '<label>' +

        escapeHtml(
          label
        ) +

      '</label>' +

      '<select id="' +

        escapeAttribute(id) +

      '">';


  html +=

    '<option value="">' +

      'Select ' +

      escapeHtml(label) +

    '</option>';


  options.forEach(
    function (option) {

      const selected =
        String(option) ===
        String(
          selectedValue || ''
        )

          ? ' selected'

          : '';


      html +=

        '<option ' +

          'value="' +
            escapeAttribute(
              option
            ) +
          '"' +

          selected +

        '>' +

          escapeHtml(
            option
          ) +

        '</option>';

    }
  );


  html +=

      '</select>' +

    '</div>';


  return html;

}

    );

 * ERROR
 *************************************************/

function showError(message) {

    document.getElementById(
      'error'
    );


  if (!error) {
    return;
  }


  error.textContent =
    message ||
    'Something went wrong.';


  error.classList.remove(

  );

}


/*************************************************
 * HIDE ERROR
 *************************************************/

    document.getElementById(
      'error'
    );


  if (!error) {
    return;
  }


  error.classList.add(
    'hidden'
  );

}


/*************************************************
 * NORMALIZE URL
 *************************************************/

function normalizeUrl(url) {

  let value =
    String(
      url || ''
    ).trim();


  if (!value) {
    return '';
  }


  if (
    !/^https?:\/\//i.test(
      value
    )
  ) {

    value =
      'https://' +
      value;

  }


  return value;

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * ESCAPE ATTRIBUTE
 *************************************************/

function escapeAttribute(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    );

}


/*************************************************
 * ERROR MESSAGE
 *************************************************/

function getErrorMessage(error) {

  if (!error) {

    return 'Unknown error.';

  }


  if (
    typeof error === 'string'
  ) {

    return error;

  }


  return (

    error.message ||

    'Unknown error.'

  );

}
