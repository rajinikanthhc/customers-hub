<script>

/*************************************************
 * GLOBAL VARIABLES
 *************************************************/

let map = null;

let hubs = [];
let customers = [];
let markers = [];

let activeHubIndex = -1;
let activeHub = null;
let activeCustomer = null;

let settingsOptions = null;


/*************************************************
 * START APPLICATION
 *************************************************/

window.addEventListener('load', function () {

  bindEvents();
  loadApplication();
  addCustomerButton();
  setupUniversalSearch();

});


/*************************************************
 * BIND EVENTS
 *************************************************/

function bindEvents() {

   addSettingsButton();

  const backToHubs =
    document.getElementById('backToHubs');

  if (backToHubs) {
    backToHubs.addEventListener(
      'click',
      closeCustomerPanel
    );
  }


  const backToCustomers =
    document.getElementById('backToCustomers');

  if (backToCustomers) {
    backToCustomers.addEventListener(
      'click',
      showCustomerView
    );
  }


  const openSheetButton =
    document.getElementById('openSheetButton');

  if (openSheetButton) {
    openSheetButton.addEventListener(
      'click',
      openSheet
    );
  }


  const homeButton =
    document.getElementById('homeButton');

  if (homeButton) {
    homeButton.addEventListener(
      'click',
      resetHomeView
    );
  }

  setupUniversalSearch(); 

}


/*************************************************
 * LOAD APPLICATION
 *************************************************/

function loadApplication() {

  showLoading(true);
  hideError();


  google.script.run

    .withSuccessHandler(function (config) {

      if (
        !config ||
        !config.mapApiKey
      ) {

        showLoading(false);

        showError(
          'Google Maps API key was not found.'
        );

        return;

      }


      loadGoogleMaps(
        config.mapApiKey
      );

    })

    .withFailureHandler(function (error) {

      showLoading(false);

      showError(
        getErrorMessage(error)
      );

    })

    .getAppConfig();

}


/*************************************************
 * LOAD GOOGLE MAPS
 *************************************************/

function loadGoogleMaps(apiKey) {

  if (
    window.google &&
    window.google.maps
  ) {

    initializeMap();
    return;

  }


  window.initCustomersHubMap =
    function () {

      initializeMap();

    };


  const script =
    document.createElement('script');


  script.src =
    'https://maps.googleapis.com/maps/api/js' +
    '?key=' +
    encodeURIComponent(apiKey) +
    '&callback=initCustomersHubMap';


  script.async = true;
  script.defer = true;


  script.onerror =
    function () {

      showLoading(false);

      showError(
        'Unable to load Google Maps. ' +
        'Please check your API key and Maps JavaScript API.'
      );

    };


  document.head.appendChild(script);

}


/*************************************************
 * INITIALIZE MAP
 *************************************************/

function initializeMap() {

  map =
    new google.maps.Map(
      document.getElementById('map'),
      {

        center: {
          lat: 12.9716,
          lng: 77.5946
        },

        zoom: 11,

        styles: [

          {
            featureType: 'all',
            elementType: 'labels',
            stylers: [
              {
                visibility: 'off'
              }
            ]
          },

          {
            featureType: 'road',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          },

          {
            featureType: 'administrative',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          },

          {
            featureType: 'landscape',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          },

          {
            featureType: 'water',
            elementType: 'geometry',
            stylers: [
              {
                visibility: 'on'
              }
            ]
          }

        ],

        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        zoomControl: true,
        clickableIcons: false,
        gestureHandling: 'greedy'

      }
    );


  loadHubs();

}


/*************************************************
 * LOAD INDUSTRIAL HUBS
 *************************************************/

function loadHubs() {

  showLoading(true);
  hideError();


  google.script.run

    .withSuccessHandler(function (data) {

      hubs = data || [];


      const count =
        document.getElementById('hubCount');

      if (count) {
        count.textContent =
          hubs.length;
      }


      renderHubMarkers();

      showLoading(false);

    })

    .withFailureHandler(function (error) {

      showLoading(false);

      showError(
        getErrorMessage(error)
      );

    })

    .getIndustrialHubs();

}


/*************************************************
 * RENDER INDUSTRIAL HUB MARKERS
 *************************************************/

function renderHubMarkers() {

  markers.forEach(function (marker) {

    marker.setMap(null);

  });

  markers = [];


  if (!hubs.length) {
    return;
  }


  hubs.forEach(function (hub, index) {

    const position = {

      lat: Number(hub.latitude),

      lng: Number(hub.longitude)

    };


    const name =
      String(hub.hub || '');


    const textWidth =
      Math.max(
        45,
        Math.min(
          150,
          name.length * 7 + 12
        )
      );


    const textHeight = 24;


    /*
     * Transparent clickable area.
     * Only text is visible.
     */

    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" ' +
      'width="' + textWidth + '" ' +
      'height="' + textHeight + '">' +

        '<rect ' +
          'x="0" ' +
          'y="0" ' +
          'width="' + textWidth + '" ' +
          'height="' + textHeight + '" ' +
          'fill="white" ' +
          'fill-opacity="0.01"/>' +

      '</svg>';


    const transparentIcon = {

      url:
        'data:image/svg+xml;charset=UTF-8,' +
        encodeURIComponent(svg),

      scaledSize:
        new google.maps.Size(
          textWidth,
          textHeight
        ),

      anchor:
        new google.maps.Point(
          textWidth / 2,
          textHeight / 2
        )

    };


    const marker =
      new google.maps.Marker({

        position: position,

        map: map,

        title: name,

        icon: transparentIcon,

        label: {

          text: name,

          color: '#202124',

          fontFamily:
            'Roboto, Arial, sans-serif',

          fontSize: '12px',

          fontWeight: '500'

        },

        clickable: true,

        zIndex:
          1000 + index

      });


    marker.addListener(
      'click',
      function () {

        selectHub(index);

      }
    );


    markers.push(marker);

  });


  /*
   * Initial view:
   * Central Bengaluru
   */

  map.setCenter({

    lat: 12.9716,

    lng: 77.5946

  });


  map.setZoom(11);

}


/*************************************************
 * SELECT INDUSTRIAL HUB
 *************************************************/

function selectHub(index) {

  if (
    index < 0 ||
    index >= hubs.length
  ) {
    return;
  }


  activeHubIndex =
    index;

  activeHub =
    hubs[index];


  /*
   * Move map to selected hub.
   */

  if (map) {

    map.panTo({

      lat:
        Number(
          activeHub.latitude
        ),

      lng:
        Number(
          activeHub.longitude
        )

    });

  }


  loadCustomersByHub(
    activeHub.hub
  );

}


/*************************************************
 * LOAD CUSTOMERS BY HUB
 *************************************************/

function loadCustomersByHub(
  hubName
) {

  showCustomerView();


  const loading =
    document.getElementById(
      'customerLoading'
    );


  const list =
    document.getElementById(
      'customerList'
    );


  if (loading) {

    loading.classList.remove(
      'hidden'
    );

  }


  if (list) {

    list.innerHTML = '';

  }


  const selectedHubName =
    document.getElementById(
      'selectedHubName'
    );


  if (selectedHubName) {

    selectedHubName.textContent =
      hubName;

  }


  const selectedHubCity =
    document.getElementById(
      'selectedHubCity'
    );


  if (selectedHubCity) {

    selectedHubCity.textContent =
      activeHub
        ? activeHub.city
        : '';

  }


  google.script.run

    .withSuccessHandler(
      function (data) {

        customers =
          data || [];


        if (loading) {

          loading.classList.add(
            'hidden'
          );

        }


        renderCustomerList();

      }
    )

    .withFailureHandler(
      function (error) {

        if (loading) {

          loading.classList.add(
            'hidden'
          );

        }


        if (list) {

          list.innerHTML =
            '<div class="loading">' +
              escapeHtml(
                getErrorMessage(error)
              ) +
            '</div>';

        }

      }
    )

    .getCustomersByHub(
      hubName
    );

}


/*************************************************
 * RENDER CUSTOMER LIST
 *************************************************/

function renderCustomerList() {

  const list =
    document.getElementById(
      'customerList'
    );


  if (!list) {
    return;
  }


  list.innerHTML = '';


  const selectedHubCity =
    document.getElementById(
      'selectedHubCity'
    );


  if (selectedHubCity) {

    selectedHubCity.textContent =

      (activeHub
        ? activeHub.city
        : '') +

      ' · ' +

      customers.length +

      ' Customers';

  }


  if (!customers.length) {

    list.innerHTML =
      '<div class="loading">' +
        'No customers found in this Industrial Hub.' +
      '</div>';

    return;

  }


  customers.forEach(
    function (
      customer,
      index
    ) {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'customer-item';


      const customerName =
        getField(
          customer,
          [
            'customerName',
            'Customer Name',
            'Company',
            'company'
          ]
        );


      const industrialArea =
        getField(
          customer,
          [
            'industrialArea',
            'Industrial Area'
          ]
        );


      const city =
        getField(
          customer,
          [
            'city',
            'City'
          ]
        );


      item.innerHTML =

        '<div class="customer-name">' +

          escapeHtml(
            customerName || '-'
          ) +

        '</div>' +

        '<div class="customer-area">' +

          'Industrial Area: ' +

          escapeHtml(
            industrialArea || '-'
          ) +

        '</div>' +

        '<div class="customer-city">' +

          escapeHtml(
            city || ''
          ) +

        '</div>';


      item.addEventListener(
        'click',
        function () {

          selectCustomer(index);

        }
      );


      list.appendChild(item);

    }
  );

}


/*************************************************
 * SELECT CUSTOMER
 *************************************************/

function selectCustomer(index) {

  if (
    index < 0 ||
    index >= customers.length
  ) {
    return;
  }


  activeCustomer =
    customers[index];


  renderCustomerDetail();

  showDetailView();


  if (activeHub && map) {

    map.panTo({

      lat:
        Number(
          activeHub.latitude
        ),

      lng:
        Number(
          activeHub.longitude
        )

    });

  }

}

 * RENDER CUSTOMER DETAILS

    getField(
      customer,
      [
        'type',

      ]
    );


  const status =

      customer,
      [
        'status',
        'Status'
      ]
    );


  const potential =
    getField(
      customer,
      [
        'potential',
        'Potential'
      ]
    );


  const notes =
    getField(

      [

        'Notes'
      ]
    );


  const website =

      customer,

      ]

  let html = '';


  /*

   */

  html +=

    '<div class="detail-header-row">' +

      '<div>' +

        '<div class="detail-company-name">' +
          escapeHtml(
            customerName || '-'
          ) +
        '</div>' +

        '<div class="detail-company-id">' +
          'Company ID: ' +
          escapeHtml(
            companyId || '-'
          ) +
        '</div>' +

      '</div>' +

      '<button ' +
        'class="edit-icon-button" ' +

    ) +

   */

  if (website) {

  }


  /*

   */

  html +=

  html +=

    '<div id="peopleList">' +

      '</div>' +

    '</div>';


  detail.innerHTML =
    html;


  loadPeople(companyId);

}


/*************************************************
 * GET FIELD
 *************************************************/

function getField(obj, possibleNames) {

  if (!obj) {
    return '';
  }


  const keys =
    Object.keys(obj);


  for (
    let i = 0;
    i < possibleNames.length;
    i++
  ) {

    const wanted =
      String(
        possibleNames[i]
      )
      .trim()
      .toLowerCase()
      .replace(/[\s_-]+/g, '');


    for (
      let j = 0;
      j < keys.length;
      j++
    ) {

      const actual =
        String(keys[j])
          .trim()
          .toLowerCase()
          .replace(/[\s_-]+/g, '');


      if (actual === wanted) {

        const value =
          obj[keys[j]];


        /*
         * Never display literal
         * undefined / null.
         */

        if (
          value === undefined ||
          value === null
        ) {

          return '';

        }


        return value;

      }

    }

  }


  return '';

}

/*************************************************
 * CUSTOMER INFO ITEM
 *************************************************/

function customerInfoItem(
  label,
  value
) {

  return (

    '<div class="customer-info-item">' +

      '<div class="customer-info-label">' +
        escapeHtml(label) +
      '</div>' +

      '<div class="customer-info-value">' +
        escapeHtml(value || '-') +
      '</div>' +

    '</div>'

  );

}

/*************************************************
 * FORMAT POTENTIAL
 *************************************************/

function formatPotential(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '-';

  }


  const number =
    Number(
      String(value)
        .replace(/,/g, '')
        .replace(/₹/g, '')
    );


  if (!isNaN(number)) {

    return '₹' +
      number.toLocaleString(
        'en-IN'
      );

  }


  return String(value);

}


/*************************************************
 * LOAD PEOPLE
 *************************************************/

function loadPeople(companyId) {

  google.script.run

    .withSuccessHandler(
      function (people) {

        renderPeople(
          people || []
        );

      }
    )

    .withFailureHandler(
      function (error) {

        const container =
          document.getElementById(
            'peopleList'
          );


        if (container) {

          container.innerHTML =

            '<div class="no-contacts">' +

              'Unable to load contact details.' +

            '</div>';

        }

        console.error(error);

      }
    )

    .getPeopleByCompanyId(
      companyId
    );

}

/*************************************************
 * RENDER PEOPLE
 *************************************************/

function renderPeople(people) {

  const container =
    document.getElementById('peopleList');

  if (!container) {
    return;
  }

  container.innerHTML = '';

  /*
   * No contacts
   */

  if (!people || !people.length) {

    const message =
      document.createElement('div');

    message.className =
      'no-contacts';

    message.textContent =
      'No contact details available.';

    container.appendChild(message);

  }


  /*
   * Existing contacts
   */

  if (people && people.length) {

    people.forEach(function(person) {

      const name =
        getField(
          person,
          ['name', 'Name']
        );

      const designation =
        getField(
          person,
          ['designation', 'Designation']
        );

      const phone =
        getField(
          person,
          ['phone', 'Phone']
        );

      const email =
        getField(
          person,
          ['email', 'Email']
        );

      const visitingCard =
        getField(
          person,
          [
            'visitingCardUrl',
            'visitingCard',
            'Visiting Card',
            'photo',
            'Photo'
          ]
        );

      const peopleId =
        getField(
          person,
          [
            'peopleId',
            'People ID'
          ]
        );


      const card =
        document.createElement('div');

      card.className =
        'person-card';


      let html = '';


      html +=

        '<div class="person-header">' +

          '<div class="person-name">' +
            escapeHtml(name || '-') +
          '</div>' +

          '<button ' +
            'class="person-edit-button" ' +
            'type="button" ' +
            'title="Edit Contact" ' +
            'onclick="openPersonEdit(\'' +
              escapeAttribute(peopleId) +
            '\')">' +

            '✎' +

          '</button>' +

        '</div>';


      if (designation) {

        html +=

          '<div class="person-designation">' +
            escapeHtml(designation) +
          '</div>';

      }


      if (phone) {

        html +=

          '<div class="person-row">' +

            '<span class="contact-label">' +
              'Phone:' +
            '</span>' +

            '<span class="contact-value">' +

              '<a href="tel:' +
                escapeAttribute(phone) +
              '">' +

                escapeHtml(phone) +

              '</a>' +

            '</span>' +

          '</div>';

      }


      if (email) {

        html +=

          '<div class="person-row">' +

            '<span class="contact-label">' +
              'Email:' +
            '</span>' +

            '<span class="contact-value">' +

              '<a href="mailto:' +
                escapeAttribute(email) +
              '">' +

                escapeHtml(email) +

              '</a>' +

            '</span>' +

          '</div>';

      }


      if (visitingCard) {

        html +=

          '<button ' +
            'type="button" ' +
            'class="visiting-card" ' +
            'onclick="toggleVisitingCard(this)" ' +
            'data-card-url="' +
              escapeAttribute(
                normalizeUrl(visitingCard)
              ) +
            '">' +

            'View Visiting Card' +

          '</button>' +

          '<div class="visiting-card-preview hidden">' +

            '<img ' +
              'src="' +
                escapeAttribute(
                  normalizeUrl(visitingCard)
                ) +
              '" ' +
              'alt="Visiting Card" ' +
              'loading="lazy">' +

          '</div>';

      }


      card.innerHTML =
        html;


      container.appendChild(card);

    });

  }


  /*
   * ADD CONTACT BUTTON
   */

  const addButton =
    document.createElement('button');


  addButton.type =
    'button';


  addButton.className =
    'add-contact-button';


  addButton.textContent =
    '+ Add Contact';


  /*
   * Make the button clearly visible
   * without depending on CSS.
   */

  addButton.style.display =
    'block';

  addButton.style.width =
    '100%';

  addButton.style.margin =
    '14px 0 20px 0';

  addButton.style.padding =
    '10px 14px';

  addButton.style.background =
    '#198754';

  addButton.style.color =
    '#ffffff';

  addButton.style.border =
    '0';

  addButton.style.borderRadius =
    '6px';

  addButton.style.fontSize =
    '14px';

  addButton.style.fontWeight =
    '600';

  addButton.style.cursor =
    'pointer';


  addButton.addEventListener(
    'click',
    function() {

      openPersonEdit('');

    }
  );


  container.appendChild(
    addButton
  );

}

/*************************************************
 * TOGGLE VISITING CARD
 *************************************************/

function toggleVisitingCard(button) {

  if (!button) {
    return;
  }

  const preview =
    button.nextElementSibling;

  if (!preview) {
    return;
  }

  if (
    preview.classList.contains('hidden')
  ) {

    preview.classList.remove('hidden');

    button.textContent =
      'Hide Visiting Card';

  } else {

    preview.classList.add('hidden');

    button.textContent =
      'View Visiting Card';

  }

}


/*************************************************
 * SHOW CUSTOMER VIEW
 *************************************************/

function showCustomerView() {

  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'customerView'
    )
    .classList.remove(
      'hidden'
    );

}


/*************************************************
 * SHOW DETAIL VIEW
 *************************************************/

function showDetailView() {

  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.remove(
      'hidden'
    );

}


/*************************************************
 * CLOSE CUSTOMER PANEL
 *************************************************/

function closeCustomerPanel() {

  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  activeCustomer = null;

}


/*************************************************
 * EDIT CUSTOMER
 *************************************************/

function openCustomerEdit() {

  if (!activeCustomer) {
    return;
  }


  loadSettingsOptions(
    function (options) {

      showCustomerEditForm(
        options
      );

    }
  );

}

/*************************************************
 * REFRESH CUSTOMER DETAILS
 *************************************************/

function refreshCustomerDetails() {

  if (!activeCustomer) {
    return;
  }


  const companyId =
    getField(
      activeCustomer,
      [
        'companyId',
        'Company ID'
      ]
    );


  /*
   * Reload the selected hub.
   * This makes sure the app has
   * the latest Sheet data.
   */

  if (!activeHub) {

    renderCustomerDetail();

    return;

  }


  google.script.run

    .withSuccessHandler(
      function (data) {

        const updatedCustomers =
          data || [];


        const updated =
          updatedCustomers.find(
            function (customer) {

              const id =
                getField(
                  customer,
                  [
                    'companyId',
                    'Company ID'
                  ]
                );

              return String(id) ===
                String(companyId);

            }
          );


        if (updated) {

          activeCustomer =
            updated;

        }


        customers =
          updatedCustomers;


        renderCustomerDetail();

      }
    )

    .withFailureHandler(
      function () {

        /*
         * If refresh fails,
         * at least show local data.
         */

        renderCustomerDetail();

      }
    )

    .getCustomersByHub(
      activeHub.hub
    );

}

/*************************************************
 * SAVE PERSON
 *************************************************/

function savePerson() {

  const peopleId =
    document
      .getElementById(
        'editPeopleId'
      )
      .value
      .trim();


  const companyId =
    getField(
      activeCustomer,
      [
        'companyId',
        'Company ID'
      ]
    );


  const name =
    document
      .getElementById(
        'editPersonName'
      )
      .value
      .trim();


  const designation =
    document
      .getElementById(
        'editPersonDesignation'
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        'editPersonPhone'
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        'editPersonEmail'
      )
      .value
      .trim();


  const existingPhoto =
    document
      .getElementById(
        'editPersonPhoto'
      )
      .value
      .trim();


  const fileInput =
    document.getElementById(
      'editPersonPhotoFile'
    );


  const file =
    fileInput &&
    fileInput.files &&
    fileInput.files.length
      ? fileInput.files[0]
      : null;


  const button =
    document.getElementById(
      'editSaveButton'
    );


  button.disabled =
    true;

  button.textContent =
    'Saving...';


  const data = {

    name:
      name,

    designation:
      designation,

    phone:
      phone,

    email:
      email,

    photo:
      existingPhoto,

    photoFile:
      null

  };


  /*
   * No new image.
   * Keep existing card.
   */

  if (!file) {

    sendPersonToServer(
      peopleId,
      companyId,
      data,
      button
    );

    return;

  }


  /*
   * Validate image.
   */

  if (
    !file.type ||
    !file.type.startsWith(
      'image/'
    )
  ) {

    button.disabled =
      false;

    button.textContent =
      'Save';

    alert(
      'Please select an image file.'
    );

    return;

  }


  /*
   * Maximum 5 MB.
   */

  if (
    file.size >
    5 * 1024 * 1024
  ) {

    button.disabled =
      false;

    button.textContent =
      'Save';

    alert(
      'Visiting card image must be 5 MB or smaller.'
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function () {

      const result =
        String(
          reader.result
        );


      const base64 =
        result.split(',')[1];


      data.photoFile = {

        fileName:
          file.name,

        mimeType:
          file.type,

        base64:
          base64

      };


      sendPersonToServer(
        peopleId,
        companyId,
        data,
        button
      );

    };


  reader.onerror =
    function () {

      button.disabled =
        false;

      button.textContent =
        'Save';

      alert(
        'Unable to read the image.'
      );

    };


  reader.readAsDataURL(
    file
  );

}

/*************************************************
 * CREATE SELECT
 *************************************************/

function createSelectHtml(
  id,
  label,
  options,
  selectedValue
) {

  options =
    options || [];


  let html =

    '<div class="edit-field">' +

      '<label>' +

        escapeHtml(
          label
        ) +

      '</label>' +

      '<select id="' +

        escapeAttribute(id) +

      '">';


  html +=

    '<option value="">' +

      'Select ' +

      escapeHtml(label) +

    '</option>';


  options.forEach(
    function (option) {

      const selected =
        String(option) ===
        String(
          selectedValue || ''
        )

          ? ' selected'

          : '';


      html +=

        '<option ' +

          'value="' +
            escapeAttribute(
              option
            ) +
          '"' +

          selected +

        '>' +

          escapeHtml(
            option
          ) +

        '</option>';

    }
  );


  html +=

      '</select>' +

    '</div>';


  return html;

}

/*************************************************
 * NORMALIZE URL
 *************************************************/

function normalizeUrl(url) {

  let value =
    String(
      url || ''
    ).trim();


  if (!value) {
    return '';
  }


  if (
    !/^https?:\/\//i.test(
      value
    )
  ) {

    value =
      'https://' +
      value;

  }


  return value;

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * ESCAPE ATTRIBUTE
 *************************************************/

function escapeAttribute(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    );

}


/*************************************************
 * ERROR MESSAGE
 *************************************************/

function getErrorMessage(error) {

  if (!error) {

    return 'Unknown error.';

  }


  if (
    typeof error === 'string'
  ) {

    return error;

  }


  return (

    error.message ||

    'Unknown error.'

  );

}

/*************************************************
 * UNIVERSAL SEARCH
 *************************************************/

function setupUniversalSearch() {

  const input =
    document.getElementById(
      'universalSearch'
    );

  const clear =
    document.getElementById(
      'universalSearchClear'
    );

  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (
    !input ||
    !clear ||
    !results
  ) {

    return;

  }


  let timer = null;


  input.addEventListener(
    'input',
    function () {

      const query =
        input.value.trim();


      clear.classList.toggle(
        'hidden',
        !query
      );


      clearTimeout(timer);


      if (!query) {

        results.innerHTML = '';

        results.classList.add(
          'hidden'
        );

        return;

      }


      timer =
        setTimeout(
          function () {

            performUniversalSearch(
              query
            );

          },
          250
        );

    }
  );


  clear.addEventListener(
    'click',
    function () {

      input.value = '';

      clear.classList.add(
        'hidden'
      );

      results.innerHTML = '';

      results.classList.add(
        'hidden'
      );

      input.focus();

    }
  );


  document.addEventListener(
    'click',
    function (event) {

      const searchBox =
        document.querySelector(
          '.universal-search'
        );


      if (
        searchBox &&
        !searchBox.contains(
          event.target
        )
      ) {

        results.classList.add(
          'hidden'
        );

      }

    }
  );

}


/*************************************************
 * PERFORM UNIVERSAL SEARCH
 *************************************************/

function performUniversalSearch(
  query
) {

  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (!results) {

    return;

  }


  results.classList.remove(
    'hidden'
  );


  results.innerHTML =

    '<div class="universal-search-message">' +
      'Searching...' +
    '</div>';


  google.script.run

    .withSuccessHandler(
      function (data) {

        renderUniversalSearchResults(
          data || []
        );

      }
    )

    .withFailureHandler(
      function (error) {

        results.innerHTML =

          '<div class="universal-search-message">' +

            escapeHtml(
              getErrorMessage(error)
            ) +

          '</div>';

      }
    )

    .universalSearch(
      query
    );

}


/*************************************************
 * RENDER SEARCH RESULTS
 *************************************************/

function renderUniversalSearchResults(
  data
) {

  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (!results) {

    return;

  }


  results.innerHTML = '';


  if (
    !data ||
    !data.length
  ) {

    results.innerHTML =

      '<div class="universal-search-message">' +

        'No results found.' +

      '</div>';

    results.classList.remove(
      'hidden'
    );

    return;

  }


  data.forEach(
    function (item) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'universal-search-result';


      let icon =
        '';


      let title =
        '';


      let meta =
        '';


      if (
        item.type ===
        'hub'
      ) {

        icon =
          'H';

        title =
          item.name;

        meta =
          'Industrial Hub · ' +
          (
            item.city ||
            ''
          );

      }


      else if (
        item.type ===
        'customer'
      ) {

        icon =
          'C';

        title =
          item.name;

        meta =
          'Customer · ' +
          (
            item.industrialArea ||
            ''
          ) +
          ' · ' +
          (
            item.industrialHub ||
            ''
          );

      }


      else if (
        item.type ===
        'person'
      ) {

        icon =
          'P';

        title =
          item.name;

        meta =
          'Contact · ' +
          (
            item.company ||
            ''
          ) +
          (
            item.designation
              ? ' · ' +
                item.designation
              : ''
          );

      }


      button.innerHTML =

        '<span class="search-result-icon">' +

          escapeHtml(
            icon
          ) +

        '</span>' +

        '<span class="search-result-text">' +

          '<span class="search-result-title">' +

            escapeHtml(
              title ||
              '-'
            ) +

          '</span>' +

          '<span class="search-result-meta">' +

            escapeHtml(
              meta
            ) +

          '</span>' +

        '</span>';


      button.addEventListener(
        'click',
        function () {

          clearUniversalSearch();

          openUniversalSearchResult(
            item
          );

        }
      );


      results.appendChild(
        button
      );

    }
  );


  results.classList.remove(
    'hidden'
  );

}


/*************************************************
 * CLEAR SEARCH
 *************************************************/

function clearUniversalSearch() {

  const input =
    document.getElementById(
      'universalSearch'
    );

  const clear =
    document.getElementById(
      'universalSearchClear'
    );

  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (input) {

    input.value = '';

  }


  if (clear) {

    clear.classList.add(
      'hidden'
    );

  }


  if (results) {

    results.innerHTML = '';

    results.classList.add(
      'hidden'
    );

  }

}


/*************************************************
 * OPEN SEARCH RESULT
 *************************************************/

function openUniversalSearchResult(
  item
) {

  if (!item) {

    return;

  }


  /*
   * INDUSTRIAL HUB
   */

  if (
    item.type ===
    'hub'
  ) {

    const index =
      hubs.findIndex(
        function (hub) {

          return String(
            hub.hub || ''
          )
          .trim()
          .toLowerCase() ===

          String(
            item.name || ''
          )
          .trim()
          .toLowerCase();

        }
      );


    if (
      index !== -1
    ) {

      selectHub(
        index
      );

    }


    return;

  }


  /*
   * CUSTOMER
   */

  if (
    item.type ===
    'customer'
  ) {

    openSearchCustomer(
      item
    );

    return;

  }


  /*
   * CONTACT PERSON
   */

  if (
    item.type ===
    'person'
  ) {

    openSearchPerson(
      item
    );

  }

}


/*************************************************
 * OPEN SEARCH CUSTOMER
 *************************************************/

function openSearchCustomer(
  item
) {

  google.script.run

    .withSuccessHandler(
      function (data) {

        customers =
          data || [];


        const index =
          customers.findIndex(
            function (customer) {

              return String(
                getField(
                  customer,
                  [
                    'companyId',
                    'Company ID'
                  ]
                )
              ).trim() ===

              String(
                item.companyId
              ).trim();

            }
          );


        if (
          index === -1
        ) {

          showError(
            'Customer not found.'
          );

          return;

        }


        activeHub =
          hubs.find(
            function (hub) {

              return String(
                hub.hub || ''
              )
              .trim()
              .toLowerCase() ===

              String(
                item.industrialHub || ''
              )
              .trim()
              .toLowerCase();

            }
          ) || null;


        if (activeHub) {

          activeHubIndex =
            hubs.indexOf(
              activeHub
            );

        }


        renderCustomerList();

        selectCustomer(
          index
        );

      }
    )

    .withFailureHandler(
      function (error) {

        showError(
          getErrorMessage(error)
        );

      }
    )

    .getCustomersByHub(
      item.industrialHub
    );

}

 *************************************************/

function editSettingItem(
  settingName,
  oldValue
) {

  const newValue =
    prompt(
      'Edit ' +
      settingName +
      ':',
      oldValue
    );

  if (newValue === null) {
    return;
  }

  const cleanValue =
    newValue.trim();

  if (!cleanValue) {

    alert(
      'Please enter a value.'
    );

    return;

  }

  if (
    cleanValue ===
    oldValue
  ) {
    return;
  }

  google.script.run

    .withSuccessHandler(
      function () {

        settingsOptions =
          null;

        openSettingList(
          settingName
        );

      }
    )

    .withFailureHandler(
      function (error) {

        alert(
          getErrorMessage(error)
        );

      }
    )

    .updateSettingValue(
      settingName,
      oldValue,
      cleanValue
    );

}


/*************************************************
 * DELETE SETTING ITEM
 *************************************************/

function deleteSettingItem(
  settingName,
  value
) {

  const confirmed =
    confirm(
      'Delete "' +
      value +
      '" from ' +
      settingName +
      '?'
    );

  if (!confirmed) {
    return;
  }

  google.script.run

    .withSuccessHandler(
      function () {

        settingsOptions =
          null;

        openSettingList(
          settingName
        );

      }
    )

    .withFailureHandler(
      function (error) {

        alert(
          getErrorMessage(error)
        );

      }
    )

    .deleteSettingValue(
      settingName,
      value
    );

}

</script>
