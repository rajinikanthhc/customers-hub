<script>

/*************************************************
 * GLOBAL VARIABLES
 *************************************************/

let map = null;

let hubs = [];

let customers = [];

let markers = [];

let activeHubIndex = -1;

let activeHub = null;

let activeCustomer = null;


/*************************************************
 * START
 *************************************************/

window.addEventListener('load', function () {

  bindEvents();

  loadApplication();

});


/*************************************************
 * BIND EVENTS
 *************************************************/

function bindEvents() {

  document
    .getElementById('backToHubs')
    .addEventListener(
      'click',
      closeCustomerPanel
    );


  document
    .getElementById('backToCustomers')
    .addEventListener(
      'click',
      showCustomerView
    );

    document
    .getElementById('openSheetButton')
    .addEventListener(
      'click',
      openSheet
    );

}


/*************************************************
 * LOAD APPLICATION
 *************************************************/

function loadApplication() {

  showLoading(true);

  hideError();


  google.script.run

    .withSuccessHandler(function (config) {

      if (
        !config ||
        !config.mapApiKey
      ) {

        showLoading(false);

        showError(
          'Google Maps API key was not found.'
        );

        return;

      }


      loadGoogleMaps(
        config.mapApiKey
      );

    })

    .withFailureHandler(function (error) {

      showLoading(false);

      showError(
        getErrorMessage(error)
      );

    })

    .getAppConfig();

}


/*************************************************
 * LOAD GOOGLE MAPS
 *************************************************/

function loadGoogleMaps(apiKey) {

  if (
    window.google &&
    window.google.maps
  ) {

    initializeMap();

    return;

  }


  window.initCustomersHubMap =
    function () {

      initializeMap();

    };


  const script =
    document.createElement('script');


  /*
   * IMPORTANT:
   * No libraries=marker.
   */

  script.src =
    'https://maps.googleapis.com/maps/api/js' +
    '?key=' +
    encodeURIComponent(apiKey) +
    '&callback=initCustomersHubMap';


  script.async = true;

  script.defer = true;


  script.onerror =
    function () {

      showLoading(false);

      showError(
        'Unable to load Google Maps. ' +
        'Please check your API key and Maps JavaScript API.'
      );

    };


  document.head.appendChild(script);

}


/*************************************************
 * INITIALIZE MAP
 *************************************************/

function initializeMap() {

  map =
    new google.maps.Map(
      document.getElementById('map'),
      {

        center: {
          lat: 12.9716,
          lng: 77.5946
        },

        zoom: 7,


        /*
         * SALES TERRITORY MAP
         *
         * Keep geography:
         * - roads
         * - boundaries
         * - water
         * - land
         *
         * Hide Google text labels.
         */

        styles: [

          {
            featureType: 'all',

            elementType: 'labels',

            stylers: [
              {
                visibility: 'off'
              }
            ]

          },


          {
            featureType: 'road',

            elementType: 'geometry',

            stylers: [
              {
                visibility: 'on'
              }
            ]

          },


          {
            featureType: 'administrative',

            elementType: 'geometry',

            stylers: [
              {
                visibility: 'on'
              }
            ]

          },


          {
            featureType: 'landscape',

            elementType: 'geometry',

            stylers: [
              {
                visibility: 'on'
              }
            ]

          },


          {
            featureType: 'water',

            elementType: 'geometry',

            stylers: [
              {
                visibility: 'on'
              }
            ]

          }

        ],


        mapTypeControl: false,

        streetViewControl: false,

        fullscreenControl: false,

        zoomControl: true,

        clickableIcons: false,

        gestureHandling: 'greedy'

      }
    );


  loadHubs();

}


/*************************************************
 * LOAD HUBS
 *************************************************/

function loadHubs() {

  google.script.run

    .withSuccessHandler(function (data) {

      hubs = data || [];


      document
        .getElementById('hubCount')
        .textContent =
        hubs.length;


      renderHubMarkers();


      showLoading(false);

    })

    .withFailureHandler(function (error) {

      showLoading(false);

      showError(
        getErrorMessage(error)
      );

    })

    .getIndustrialHubs();

}


/*************************************************
 * RENDER HUB MARKERS
 *
 * NO BULLET
 * BLACK GOOGLE-LIKE TEXT
 *************************************************/

function renderHubMarkers() {

  /*
   * Remove existing markers
   */

  markers.forEach(function (marker) {

    marker.setMap(null);

  });

  markers = [];


  if (!hubs.length) {

    return;

  }


  const bounds =
    new google.maps.LatLngBounds();


  hubs.forEach(function (hub, index) {

    const position = {

      lat: Number(hub.latitude),

      lng: Number(hub.longitude)

    };


    /*
     * Estimate the text width.
     *
     * This keeps the clickable area
     * close to the actual hub name.
     */

    const name =
      String(hub.hub || '');


    const textWidth =
      Math.max(
        45,
        Math.min(
          150,
          name.length * 7 + 12
        )
      );


    const textHeight = 24;


    /*
     * Transparent SVG.
     *
     * No visible bullet.
     */

    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" ' +
      'width="' + textWidth + '" ' +
      'height="' + textHeight + '">' +

        '<rect ' +
          'x="0" ' +
          'y="0" ' +
          'width="' + textWidth + '" ' +
          'height="' + textHeight + '" ' +
          'fill="white" ' +
          'fill-opacity="0.01"/>' +

      '</svg>';


    const transparentIcon = {

      url:
        'data:image/svg+xml;charset=UTF-8,' +
        encodeURIComponent(svg),

      scaledSize:
        new google.maps.Size(
          textWidth,
          textHeight
        ),

      anchor:
        new google.maps.Point(
          textWidth / 2,
          textHeight / 2
        )

    };


    /*
     * Standard Google Maps marker.
     *
     * Small clickable area matching
     * approximately the hub name.
     */

    const marker =
      new google.maps.Marker({

        position: position,

        map: map,

        title: name,

        icon: transparentIcon,

        label: {

          text: name,

          color: '#202124',

          fontFamily:
            'Roboto, Arial, sans-serif',

          fontSize: '12px',

          fontWeight: '500'

        },

        clickable: true,

        zIndex: 1000 + index

      });


    /*
     * Click exactly this hub.
     */

    marker.addListener(
      'click',
      function () {

        selectHub(index);

      }
    );


    markers.push(marker);

    bounds.extend(position);

  });


  /*
 * Initial map view
 *
 * Start around Central Bengaluru
 * instead of showing all 47 hubs.
 */

map.setCenter({

  lat: 12.9716,

  lng: 77.5946

});


map.setZoom(11);

}

/*************************************************
 * SELECT INDUSTRIAL HUB
 *************************************************/

function selectHub(index) {

  if (
    index < 0 ||
    index >= hubs.length
  ) {

    return;

  }


  activeHubIndex =
    index;


  activeHub =
    hubs[index];


  /*
   * Move map to hub.
   */

  map.panTo({

    lat:
      Number(
        activeHub.latitude
      ),

    lng:
      Number(
        activeHub.longitude
      )

  });


  map.setZoom(11);


  /*
   * Load customers.
   */

  loadCustomersByHub(
    activeHub.hub
  );

}


/*************************************************
 * LOAD CUSTOMERS
 *************************************************/

function loadCustomersByHub(
  hubName
) {

  showCustomerView();


  const loading =
    document.getElementById(
      'customerLoading'
    );


  const list =
    document.getElementById(
      'customerList'
    );


  loading.classList.remove(
    'hidden'
  );


  list.innerHTML = '';


  document
    .getElementById(
      'selectedHubName'
    )
    .textContent =
    hubName;


  document
    .getElementById(
      'selectedHubCity'
    )
    .textContent =
    activeHub
      ? activeHub.city
      : '';


  google.script.run

    .withSuccessHandler(
      function (data) {

        customers =
          data || [];


        loading.classList.add(
          'hidden'
        );


        renderCustomerList();

      }
    )

    .withFailureHandler(
      function (error) {

        loading.classList.add(
          'hidden'
        );


        list.innerHTML =
          '<div class="loading">' +
          escapeHtml(
            getErrorMessage(error)
          ) +
          '</div>';

      }
    )

    .getCustomersByHub(
      hubName
    );

}


/*************************************************
 * RENDER CUSTOMERS
 *************************************************/

function renderCustomerList() {

  const list =
    document.getElementById(
      'customerList'
    );


  list.innerHTML = '';

    /*
   * Show customer count for selected hub
   */

  document.getElementById(
    'selectedHubCity'
  ).textContent =
    (activeHub ? activeHub.city : '') +
    ' · ' +
    customers.length +
    ' Customers';


  if (!customers.length) {

    list.innerHTML =
      '<div class="loading">' +
      'No customers found in this Industrial Hub.' +
      '</div>';

    return;

  }


  customers.forEach(
    function (
      customer,
      index
    ) {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'customer-item';


      item.innerHTML =

        '<div class="customer-name">' +

          escapeHtml(
            customer.customerName
          ) +

        '</div>' +

        '<div class="customer-area">' +

          'Industrial Area: ' +

          escapeHtml(
            customer.industrialArea ||
            '-'
          ) +

        '</div>' +

        '<div class="customer-city">' +

          escapeHtml(
            customer.city || ''
          ) +

        '</div>';


      item.addEventListener(
        'click',
        function () {

          selectCustomer(index);

        }
      );


      list.appendChild(
        item
      );

    }
  );

}


/*************************************************
 * SELECT CUSTOMER
 *************************************************/

function selectCustomer(index) {

  if (
    index < 0 ||
    index >= customers.length
  ) {

    return;

  }


  activeCustomer =
    customers[index];


  renderCustomerDetail();


  showDetailView();


  /*
   * Keep map at selected hub.
   */

  if (activeHub) {

    map.panTo({

      lat:
        Number(
          activeHub.latitude
        ),

      lng:
        Number(
          activeHub.longitude
        )

    });

  }

}


/*************************************************
 * CUSTOMER DETAILS
 *************************************************/

function renderCustomerDetail() {

  const customer = activeCustomer;

  const detail =
    document.getElementById('customerDetail');


  if (!customer) {

    detail.innerHTML = '';

    return;

  }


  /*
   * Read customer fields
   */

  const companyId =
    getField(customer, [
      'companyId',
      'Company ID',
      'company_id'
    ]);


  const customerName =
    getField(customer, [
      'customerName',
      'Customer Name',
      'customer_name',
      'Company',
      'company'
    ]);


  const type =
    getField(customer, [
      'type',
      'Type'
    ]);


  const status =
    getField(customer, [
      'status',
      'Status'
    ]);


  const potential =
    getField(customer, [
      'potential',
      'Potential'
    ]);


  const notes =
    getField(customer, [
      'notes',
      'Notes'
    ]);


  const website =
    getField(customer, [
      'website',
      'Website'
    ]);


  let html = '';


  /**********************************************
   * CUSTOMER NAME
   **********************************************/

  html +=
    '<div class="detail-company-name">' +
      escapeHtml(
        customerName || '-'
      ) +
    '</div>';


  /**********************************************
   * COMPANY ID
   **********************************************/

  html +=
    '<div class="detail-company-id">' +
      'Company ID: ' +
      escapeHtml(
        companyId || '-'
      ) +
    '</div>';


  /**********************************************
   * CUSTOMER INFORMATION
   **********************************************/

  html +=
    '<div class="customer-info">';


  html += customerInfoItem(
    'Type',
    type
  );


  html += customerInfoItem(
    'Status',
    status
  );


  html += customerInfoItem(
    'Potential',
    formatPotential(potential)
  );


  html += customerInfoItem(
    'Notes',
    notes
  );


  html +=
    '</div>';


  /**********************************************
   * WEBSITE
   **********************************************/

  if (website) {

    html +=
      '<a class="website-link" ' +
      'href="' +
      escapeAttribute(
        normalizeUrl(website)
      ) +
      '" ' +
      'target="_blank">' +
      'Visit Website' +
      '</a>';

  }


  /**********************************************
   * PEOPLE
   **********************************************/

  html +=
    '<div class="people-heading">' +
      'People' +
    '</div>';


  html +=
    '<div id="peopleList">' +

      '<div class="loading">' +
        'Loading contacts...' +
      '</div>' +

    '</div>';


  detail.innerHTML = html;


  /**********************************************
   * LOAD CONTACTS
   **********************************************/

  loadPeople(companyId);

}

function getField(obj, possibleNames) {

  if (!obj) {
    return '';
  }


  const keys =
    Object.keys(obj);


  for (
    let i = 0;
    i < possibleNames.length;
    i++
  ) {

    const wanted =
      String(
        possibleNames[i]
      )
      .trim()
      .toLowerCase();


    for (
      let j = 0;
      j < keys.length;
      j++
    ) {

      const actual =
        String(keys[j])
          .trim()
          .toLowerCase();


      if (actual === wanted) {

        return obj[keys[j]];

      }

    }

  }


  return '';

}

function customerInfoItem(label, value) {

  return (

    '<div class="customer-info-item">' +

      '<div class="customer-info-label">' +
        escapeHtml(label) +
      '</div>' +

      '<div class="customer-info-value">' +
        escapeHtml(value || '-') +
      '</div>' +

    '</div>'

  );

}

function formatPotential(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '-';

  }


  const number =
    Number(
      String(value)
        .replace(/,/g, '')
        .replace(/₹/g, '')
    );


  if (!isNaN(number)) {

    return '₹' +
      number.toLocaleString('en-IN');

  }


  return String(value);

}

/*************************************************
 * DETAIL CARD
 *************************************************/

function detailCard(
  label,
  value
) {

  return

    '<div class="detail-card">' +

      '<div class="detail-label">' +

        escapeHtml(
          label
        ) +

      '</div>' +

      '<div class="detail-value">' +

        escapeHtml(
          value || '-'
        ) +

      '</div>' +

    '</div>';

}


/*************************************************
 * LOAD PEOPLE
 *************************************************/

function loadPeople(companyId) {

  google.script.run

    .withSuccessHandler(function (people) {

      console.log(
        'People returned:',
        people
      );

      renderPeople(
        people || []
      );

    })

    .withFailureHandler(function (error) {

      console.error(
        'People error:',
        error
      );


      const container =
        document.getElementById(
          'peopleList'
        );


      if (container) {

        container.innerHTML =
          '<div class="no-contacts">' +
            'Unable to load contact details.' +
          '</div>';

      }

    })

    .getPeopleByCompanyId(
      companyId
    );

}

/*************************************************
 * RENDER PEOPLE
 *************************************************/

function renderPeople(people) {

  const container =
    document.getElementById(
      'peopleList'
    );


  if (!container) {
    return;
  }


  if (!people || !people.length) {

    container.innerHTML =
      '<div class="no-contacts">' +
        'No contact details available.' +
      '</div>';

    return;

  }


  container.innerHTML = '';


  people.forEach(function(person) {

    const name =
      getField(person, [
        'name',
        'Name'
      ]);


    const designation =
      getField(person, [
        'designation',
        'Designation'
      ]);


    const phone =
      getField(person, [
        'phone',
        'Phone'
      ]);


    const email =
      getField(person, [
        'email',
        'Email'
      ]);


    const visitingCard =
      getField(person, [
        'visitingCardUrl',
        'visitingCard',
        'Visiting Card',
        'photo',
        'Photo'
      ]);


    const card =
      document.createElement('div');


    card.className =
      'person-card';


    let html = '';


    html +=
      '<div class="person-name">' +
        escapeHtml(name || '-') +
      '</div>';


    if (designation) {

      html +=
        '<div class="person-designation">' +
          escapeHtml(designation) +
        '</div>';

    }


    if (phone) {

      html +=
        '<div class="person-row">' +

          '<span class="contact-label">' +
            'Phone' +
          '</span>' +

          '<a href="tel:' +
            escapeAttribute(phone) +
          '">' +

            escapeHtml(phone) +

          '</a>' +

        '</div>';

    }


    if (email) {

      html +=
        '<div class="person-row">' +

          '<span class="contact-label">' +
            'Email' +
          '</span>' +

          '<a href="mailto:' +
            escapeAttribute(email) +
          '">' +

            escapeHtml(email) +

          '</a>' +

        '</div>';

    }


    if (visitingCard) {

      html +=
        '<a class="visiting-card" ' +
        'href="' +
          escapeAttribute(
            normalizeUrl(visitingCard)
          ) +
        '" ' +
        'target="_blank">' +

        'View Visiting Card' +

        '</a>';

    }


    card.innerHTML =
      html;


    container.appendChild(card);

  });

}

/*************************************************
 * SHOW CUSTOMER PANEL
 *************************************************/

function showCustomerView() {

  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'customerView'
    )
    .classList.remove(
      'hidden'
    );

}


/*************************************************
 * SHOW CUSTOMER DETAILS
 *************************************************/

function showDetailView() {

  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.remove(
      'hidden'
    );

}


/*************************************************
 * CLOSE CUSTOMER PANEL
 *************************************************/

function closeCustomerPanel() {

  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  activeCustomer = null;

}


/*************************************************
 * LOADING
 *************************************************/

function showLoading(show) {

  const loading =
    document.getElementById(
      'loading'
    );


  if (!loading) {

    return;

  }


  if (show) {

    loading.classList.remove(
      'hidden'
    );

  } else {

    loading.classList.add(
      'hidden'
    );

  }

}


/*************************************************
 * ERROR
 *************************************************/

function showError(message) {

  const error =
    document.getElementById(
      'error'
    );


  if (!error) {

    return;

  }


  error.textContent =
    message ||
    'Something went wrong.';


  error.classList.remove(
    'hidden'
  );

}


function hideError() {

  const error =
    document.getElementById(
      'error'
    );


  if (!error) {

    return;

  }


  error.classList.add(
    'hidden'
  );

}


/*************************************************
 * URL
 *************************************************/

function normalizeUrl(url) {

  let value =
    String(
      url || ''
    ).trim();


  if (!value) {

    return '';

  }


  if (
    !/^https?:\/\//i.test(
      value
    )
  ) {

    value =
      'https://' +
      value;

  }


  return value;

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * ESCAPE ATTRIBUTE
 *************************************************/

function escapeAttribute(value) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    );

}


/*************************************************
 * ERROR MESSAGE
 *************************************************/

function getErrorMessage(error) {

  if (!error) {

    return 'Unknown error.';

  }


  if (
    typeof error === 'string'
  ) {

    return error;

  }


  return (
    error.message ||
    'Unknown error.'
  );

}

function openSheet() {

  google.script.run

    .withSuccessHandler(function(url) {

      if (url) {

        window.open(
          url,
          '_blank'
        );

      }

    })

    .withFailureHandler(function(error) {

      showError(
        getErrorMessage(error)
      );

    })

    .getSpreadsheetUrl();

}

</script>
