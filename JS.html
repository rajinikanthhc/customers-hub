<script>

/*************************************************
 * GLOBAL VARIABLES
 *************************************************/

let map = null;

let areas = [];

let customers = [];

let markers = [];

let userLocationMarker = null;

let locationPickerListener = null;
let locationPickerMarker = null;
let locationPickerActive = false;

let allCustomers = [];

let customerListMode = 'area';

let activeAreaIndex = -1;

let activeArea = null;

let activeCustomer = null;

let settingsOptions = null;

let longPressTimer = null;
let longPressStartPoint = null;
let longPressActive = false;
let longPressInfoWindow = null;
let longPressMarker = null;


/*************************************************
 * START APPLICATION
 *************************************************/

window.addEventListener(
  'load',
  function() {

    bindEvents();

    loadApplication();

    addCustomerButton();

    loadTotalCustomerCount();

    setupUniversalSearch();

    setupAllCustomerSearch();

  }
);


/*************************************************
 * BIND EVENTS
 *************************************************/

function bindEvents() {

  addSettingsButton();


  const backToAreas =
    document.getElementById(
      'backToAreas'
    );

  if (backToAreas) {

    backToAreas.addEventListener(
      'click',
      closeCustomerPanel
    );

  }


  const backToCustomers =
    document.getElementById(
      'backToCustomers'
    );

  if (backToCustomers) {

    backToCustomers.addEventListener(
      'click',
      function() {

        document
          .getElementById(
            'detailView'
          )
          .classList.add(
            'hidden'
          );


        if (
          customerListMode ===
          'all'
        ) {

          document
            .getElementById(
              'allCustomersView'
            )
            .classList.remove(
              'hidden'
            );

        } else {

          showCustomerView();

        }


        restoreUniversalSearch();

      }
    );

  }


  const openSheetButton =
    document.getElementById(
      'openSheetButton'
    );

  if (openSheetButton) {

    openSheetButton.addEventListener(
      'click',
      openSheet
    );

  }


  const backFromAllCustomers =
    document.getElementById(
      'backFromAllCustomers'
    );

  if (backFromAllCustomers) {

    backFromAllCustomers.addEventListener(
      'click',
      function() {

        document
          .getElementById(
            'allCustomersView'
          )
          .classList.add(
            'hidden'
          );


        customerListMode =
          'area';


        restoreUniversalSearch();

      }
    );

  }


  const homeButton =
    document.getElementById(
      'homeButton'
    );

  if (homeButton) {

    homeButton.addEventListener(
      'click',
      resetHomeView
    );

  }

}


/*************************************************
 * LOAD APPLICATION
 *************************************************/

function loadApplication() {

  showLoading(true);

  hideError();


  google.script.run

    .withSuccessHandler(
      function(config) {

        if (
          !config ||
          !config.mapApiKey
        ) {

          showLoading(false);

          showError(
            'Google Maps API key was not found.'
          );

          return;

        }


        loadGoogleMaps(
          config.mapApiKey
        );

      }
    )

    .withFailureHandler(
      function(error) {

        showLoading(false);

        showError(
          getErrorMessage(error)
        );

      }
    )

    .getAppConfig();

}


/*************************************************
 * LOAD GOOGLE MAPS
 *************************************************/

function loadGoogleMaps(
  apiKey
) {

  if (
    window.google &&
    window.google.maps
  ) {

    initializeMap();

    return;

  }


  window.initCustomersHubMap =
    function() {

      initializeMap();

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
  'https://maps.googleapis.com/maps/api/js' +
  '?key=' +
  encodeURIComponent(apiKey) +
  '&libraries=places' +
  '&callback=initCustomersHubMap';


  script.async = true;

  script.defer = true;


  script.onerror =
    function() {

      showLoading(false);

      showError(
        'Unable to load Google Maps. ' +
        'Please check your API key and Maps JavaScript API.'
      );

    };


  document.head.appendChild(
    script
  );

}


/*************************************************
 * INITIALIZE MAP
 *************************************************/

function initializeMap() {

  map =
    new google.maps.Map(
      document.getElementById(
        'map'
      ),
      {

        center: {

          lat:
            12.9716,

          lng:
            77.5946

        },

        zoom: 11,

        styles: [

          /*
           * Hide all labels.
           */

          {

            featureType:
              'all',

            elementType:
              'labels',

            stylers: [

              {
                visibility:
                  'off'
              }

            ]

          },

          /*
           * Show road names only.
           */

          {

            featureType:
              'road',

            elementType:
              'labels.text',

            stylers: [

              {
                visibility:
                  'on'
              }

            ]

          },

          {

            featureType:
              'road',

            elementType:
              'geometry',

            stylers: [

              {
                visibility:
                  'on'
              }

            ]

          },

          {

            featureType:
              'landscape',

            elementType:
              'geometry',

            stylers: [

              {
                visibility:
                  'on'
              }

            ]

          },

          {

            featureType:
              'water',

            elementType:
              'geometry',

            stylers: [

              {
                visibility:
                  'on'
              }

            ]

          },

          {

            featureType:
              'administrative',

            elementType:
              'geometry',

            stylers: [

              {
                visibility:
                  'on'
              }

            ]

          }

        ],

        mapTypeControl:
          false,

        streetViewControl:
          false,

        fullscreenControl:
          false,

        zoomControl:
          true,

        clickableIcons:
          false,

        gestureHandling:
          'greedy'

      }
    );

  setupMapLongPress();
  loadAreas();

}


/*************************************************
 * CANCEL LONG PRESS
 *************************************************/

function cancelMapLongPress() {

  clearTimeout(
    longPressTimer
  );


  longPressTimer =
    null;


  longPressStartPoint =
    null;


  longPressActive =
    false;

}

/*************************************************
 * MAP LONG PRESS
 *
 * Long press anywhere on the Google map.
 * Uses Google's actual map event LatLng.
 *************************************************/

function setupMapLongPress() {

  if (!map) {
    return;
  }


  /*
   * Prevent duplicate listeners.
   */

  if (map.__longPressReady) {
    return;
  }

  map.__longPressReady = true;


  /*
   * ---------------------------------------------
   * MOUSE DOWN
   * ---------------------------------------------
   */

  map.addListener(
    'mousedown',
    function(event) {

      if (!event.latLng) {
        return;
      }


      /*
       * Cancel any previous timer.
       */

      clearTimeout(
        longPressTimer
      );


      longPressActive =
        false;


      /*
       * IMPORTANT:
       *
       * Google Maps itself gives us the exact
       * latitude/longitude at the pressed point.
       *
       * No pixel calculation.
       */

      const selectedLatLng =
        event.latLng;


      /*
       * Wait 900 ms.
       */

      longPressTimer =
        setTimeout(
          function() {

            longPressActive =
              true;


            showRealLocationDetails(
              selectedLatLng
            );

          },
          900
        );

    }
  );


  /*
   * ---------------------------------------------
   * DRAG START
   *
   * If user starts moving the map,
   * this is not a long press.
   * ---------------------------------------------
   */

  map.addListener(
    'dragstart',
    function() {

      clearTimeout(
        longPressTimer
      );


      longPressTimer =
        null;


      longPressActive =
        false;

    }
  );


  /*
   * ---------------------------------------------
   * MOUSE UP
   * ---------------------------------------------
   */

  map.addListener(
    'mouseup',
    function() {

      clearTimeout(
        longPressTimer
      );


      longPressTimer =
        null;

    }
  );

}

/*************************************************
 * SHOW REAL GOOGLE LOCATION
 *************************************************/

async function showRealLocationDetails(latLng) {

  if (!latLng || !map) {
    return;
  }

  const latitude = Number(latLng.lat());
  const longitude = Number(latLng.lng());

  /*
   * Remove previous marker
   */

  if (longPressMarker) {
    longPressMarker.setMap(null);
  }

  /*
   * Create marker
   */

  longPressMarker =
    new google.maps.Marker({
      position: latLng,
      map: map,
      title: 'Selected Location',
      zIndex: 100000
    });

  /*
   * Close previous info window
   */

  if (longPressInfoWindow) {
    longPressInfoWindow.close();
  }

  /*
   * Show loading popup
   */

  longPressInfoWindow =
    new google.maps.InfoWindow({
      content:
        '<div style="' +
          'font-family:Arial,sans-serif;' +
          'min-width:260px;' +
          'padding:5px;' +
        '">' +

          '<div style="' +
            'font-size:15px;' +
            'font-weight:700;' +
            'margin-bottom:8px;' +
          '">' +

            '📍 Location Details' +

          '</div>' +

          '<div style="' +
            'font-size:12px;' +
            'color:#666;' +
          '">' +

            'Finding Google Maps address...' +

          '</div>' +

        '</div>'
    });

  longPressInfoWindow.setPosition(latLng);

  longPressInfoWindow.open(map);


  /*
   * LOAD GEOCODING LIBRARY
   */

  let geocoding;

  try {

    geocoding =
      await google.maps.importLibrary(
        'geocoding'
      );

  } catch (error) {

    console.error(
      'Geocoding library error:',
      error
    );

    showReverseGeocodeError(
      latitude,
      longitude,
      'Unable to load Google Geocoding API. ' +
      (error && error.message
        ? error.message
        : '')
    );

    return;
  }


  const Geocoder =
    geocoding.Geocoder;


  if (!Geocoder) {

    showReverseGeocodeError(
      latitude,
      longitude,
      'Google Geocoder is unavailable.'
    );

    return;
  }


  const geocoder =
    new Geocoder();


  /*
   * REVERSE GEOCODING
   */

  try {

    const response =
      await geocoder.geocode({

        location: latLng,

        language: 'en',

        region: 'IN'

      });


    console.log(
      'Google Geocoder response:',
      response
    );


    const results =
      response.results || [];


    if (!results.length) {

      showReverseGeocodeError(
        latitude,
        longitude,
        'Google returned ZERO_RESULTS for this location.'
      );

      return;
    }


    /*
     * Google's best result
     */

    const result =
      results[0];


    console.log(
      'Google address:',
      result.formatted_address
    );


    const details =
      extractGoogleAddressDetails(
        result
      );


    const content =
      buildLocationDetailsHtml(
        result,
        details,
        latitude,
        longitude
      );


    longPressInfoWindow.setContent(
      content
    );

    longPressInfoWindow.setPosition(
      latLng
    );

    longPressInfoWindow.open(
      map
    );


  } catch (error) {

    console.error(
      'Google reverse geocoding error:',
      error
    );


    let errorMessage =
      'Google reverse geocoding failed.';


    if (
      error &&
      error.message
    ) {

      errorMessage =
        error.message;

    }


    showReverseGeocodeError(
      latitude,
      longitude,
      errorMessage
    );

  }

}


/*************************************************
 * REVERSE GEOCODING ERROR
 *************************************************/

function showReverseGeocodeError(
  latitude,
  longitude,
  message
) {

  if (!longPressInfoWindow) {
    return;
  }


  longPressInfoWindow.setContent(

    '<div style="' +

      'font-family:Arial,sans-serif;' +

      'min-width:280px;' +

      'max-width:340px;' +

      'padding:5px;' +

    '">' +


      '<div style="' +

        'font-size:15px;' +

        'font-weight:700;' +

        'margin-bottom:8px;' +

      '">' +

        '📍 Selected Location' +

      '</div>' +


      locationInfoRow(
        'Latitude',
        latitude.toFixed(6)
      ) +


      locationInfoRow(
        'Longitude',
        longitude.toFixed(6)
      ) +


      '<div style="' +

        'font-size:12px;' +

        'color:#dc3545;' +

        'margin-top:10px;' +

        'line-height:1.5;' +

      '">' +

        '<strong>Google Geocoder:</strong><br>' +

        escapeHtml(
          message ||
          'Unknown geocoding error.'
        ) +

      '</div>' +


    '</div>'

  );


  longPressInfoWindow.setPosition({

    lat: latitude,

    lng: longitude

  });


  longPressInfoWindow.open(
    map
  );

}

/*************************************************
 * EXTRACT GOOGLE ADDRESS DETAILS
 *************************************************/

function extractGoogleAddressDetails(
  result
) {

  const details = {

    area:
      '',

    neighborhood:
      '',

    city:
      '',

    district:
      '',

    state:
      '',

    postalCode:
      '',

    country:
      ''

  };


  const components =
    result.address_components ||
    [];


  components.forEach(
    function(component) {

      const types =
        component.types ||
        [];


      /*
       * AREA
       */

      if (
        !details.area &&
        (
          types.indexOf(
            'sublocality_level_2'
          ) !== -1 ||

          types.indexOf(
            'sublocality_level_3'
          ) !== -1
        )
      ) {

        details.area =
          component.long_name;

      }


      /*
       * NEIGHBORHOOD
       */

      if (
        !details.neighborhood &&
        (
          types.indexOf(
            'neighborhood'
          ) !== -1 ||

          types.indexOf(
            'sublocality_level_1'
          ) !== -1
        )
      ) {

        details.neighborhood =
          component.long_name;

      }


      /*
       * CITY
       */

      if (
        !details.city &&
        types.indexOf(
          'locality'
        ) !== -1
      ) {

        details.city =
          component.long_name;

      }


      /*
       * If locality is not available,
       * use administrative district.
       */

      if (
        !details.city &&
        types.indexOf(
          'administrative_area_level_2'
        ) !== -1
      ) {

        details.city =
          component.long_name;

      }


      /*
       * DISTRICT
       */

      if (
        !details.district &&
        types.indexOf(
          'administrative_area_level_2'
        ) !== -1
      ) {

        details.district =
          component.long_name;

      }


      /*
       * STATE
       */

      if (
        !details.state &&
        types.indexOf(
          'administrative_area_level_1'
        ) !== -1
      ) {

        details.state =
          component.long_name;

      }


      /*
       * PIN CODE
       */

      if (
        !details.postalCode &&
        types.indexOf(
          'postal_code'
        ) !== -1
      ) {

        details.postalCode =
          component.long_name;

      }


      /*
       * COUNTRY
       */

      if (
        !details.country &&
        types.indexOf(
          'country'
        ) !== -1
      ) {

        details.country =
          component.long_name;

      }

    }
  );


  return details;

}

/*************************************************
 * BUILD LOCATION DETAILS POPUP
 *************************************************/

function buildLocationDetailsHtml(
  result,
  details,
  latitude,
  longitude
) {

  let html = '';


  html +=

    '<div style="' +

      'font-family:Arial,sans-serif;' +

      'min-width:260px;' +

      'max-width:320px;' +

      'padding:4px;' +

    '">' +


      '<div style="' +

        'font-size:16px;' +

        'font-weight:700;' +

        'margin-bottom:8px;' +

      '">' +

        '📍 Location Details' +

      '</div>';


  /*
   * Google's actual formatted address.
   */

  if (
    result.formatted_address
  ) {

    html +=

      '<div style="' +

        'font-size:13px;' +

        'font-weight:600;' +

        'line-height:1.4;' +

        'margin-bottom:10px;' +

      '">' +

        escapeHtml(
          result.formatted_address
        ) +

      '</div>';

  }


  /*
   * Area / locality.
   */

  if (
    details.area
  ) {

    html += locationInfoRow(
      'Area',
      details.area
    );

  }


  if (
    details.neighborhood
  ) {

    html += locationInfoRow(
      'Neighborhood',
      details.neighborhood
    );

  }


  if (
    details.city
  ) {

    html += locationInfoRow(
      'City',
      details.city
    );

  }


  if (
    details.district
  ) {

    html += locationInfoRow(
      'District',
      details.district
    );

  }


  if (
    details.state
  ) {

    html += locationInfoRow(
      'State',
      details.state
    );

  }


  if (
    details.postalCode
  ) {

    html += locationInfoRow(
      'PIN',
      details.postalCode
    );

  }


  if (
    details.country
  ) {

    html += locationInfoRow(
      'Country',
      details.country
    );

  }


  /*
   * Exact coordinates.
   */

  html +=

    '<div style="' +

      'margin-top:10px;' +

      'padding-top:8px;' +

      'border-top:1px solid #eee;' +

    '">' +

      locationInfoRow(
        'Latitude',
        latitude.toFixed(6)
      ) +

      locationInfoRow(
        'Longitude',
        longitude.toFixed(6)
      ) +

    '</div>';


  html +=

      '<div style="' +

        'font-size:10px;' +

        'color:#888;' +

        'margin-top:7px;' +

      '">' +

        'Location information from Google Maps' +

      '</div>' +


    '</div>';


  return html;

}


/*************************************************
 * LOCATION INFO ROW
 *************************************************/

function locationInfoRow(
  label,
  value
) {

  return (

    '<div style="' +

      'display:flex;' +

      'gap:8px;' +

      'font-size:12px;' +

      'line-height:1.5;' +

      'margin:2px 0;' +

    '">' +

      '<span style="' +

        'font-weight:600;' +

        'min-width:82px;' +

      '">' +

        escapeHtml(
          label
        ) +

      ':</span>' +

      '<span>' +

        escapeHtml(
          value || '-'
        ) +

      '</span>' +

    '</div>'

  );

}

/*************************************************
 * LOAD INDUSTRIAL AREAS
 *************************************************/

function loadAreas() {

  showLoading(true);

  hideError();


  google.script.run

    .withSuccessHandler(
      function(data) {

        areas =
          data || [];


        const count =
          document.getElementById(
            'areaCount'
          );

        if (count) {

          count.textContent =
            areas.length;

        }


        google.script.run

          .withSuccessHandler(
            function(customerCounts) {

              window.customerCountsByArea =
                customerCounts || {};

              renderAreaMarkers();

              showLoading(false);

            }
          )

          .withFailureHandler(
            function(error) {

              console.log(
                'Customer count error:',
                error
              );

              window.customerCountsByArea =
                {};

              renderAreaMarkers();

              showLoading(false);

            }
          )

          .getCustomerCountsByArea();

      }
    )

    .withFailureHandler(
      function(error) {

        showLoading(false);

        showError(
          getErrorMessage(error)
        );

      }
    )

    .getIndustrialAreas();

}

/*************************************************
 * RENDER AREA MARKERS
 *************************************************/

function renderAreaMarkers() {

  markers.forEach(
    function(marker) {

      marker.setMap(null);

    }
  );


  markers = [];


  if (!areas.length) {

    return;

  }


  areas.forEach(
    function(area, index) {

      const position = {

        lat:
          Number(
            area.latitude
          ),

        lng:
          Number(
            area.longitude
          )

      };


      const name =
        String(
          area.industrialArea || ''
        );

        const customerCount =
  (
    window.customerCountsByArea || {}
  )[
    name
      .trim()
      .toLowerCase()
  ] || 0;

const labelText =
  name +
  ' (' +
  customerCount +
  ')';

      const textWidth =
        Math.max(
          45,
          Math.min(
            170,
            labelText.length * 7 + 12
          )
        );


      const textHeight =
        24;


      /*
       * Transparent clickable area.
       * Only area text is visible.
       */

      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" ' +
        'width="' +
          textWidth +
        '" ' +
        'height="' +
          textHeight +
        '">' +

          '<rect ' +
            'x="0" ' +
            'y="0" ' +
            'width="' +
              textWidth +
            '" ' +
            'height="' +
              textHeight +
            '" ' +
            'fill="white" ' +
            'fill-opacity="0.01"/>' +

        '</svg>';


      const transparentIcon = {

        url:
          'data:image/svg+xml;charset=UTF-8,' +
          encodeURIComponent(svg),

        scaledSize:
          new google.maps.Size(
            textWidth,
            textHeight
          ),

        anchor:
          new google.maps.Point(
            textWidth / 2,
            textHeight / 2
          )

      };


      const marker =
        new google.maps.Marker({

          position:
            position,

          map:
            map,

          title:
            name,

          icon:
            transparentIcon,

          label: {

            text:
  labelText,
            color:
              '#FF0000',

            fontFamily:
              'Roboto, Arial, sans-serif',

            fontSize:
              '12px',

            fontWeight:
              '500'

          },

          clickable:
            true,

          zIndex:
            1000 + index

        });


      marker.addListener(
        'click',
        function() {

          selectArea(index);

        }
      );


      markers.push(
        marker
      );

    }
  );


  map.setCenter({

    lat:
      12.9716,

    lng:
      77.5946

  });


  map.setZoom(
    11
  );

}

/*************************************************
 * SHOW USER GPS LOCATION
 *************************************************/

function showUserLocation() {

  if (
    !navigator.geolocation
  ) {

    console.log(
      'GPS location is not supported by this browser.'
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      const userPosition = {

        lat:
          latitude,

        lng:
          longitude

      };


      /*
       * Remove previous user marker
       */

      if (userLocationMarker) {

        userLocationMarker.setMap(
          null
        );

      }


      /*
       * Blue GPS dot
       */

      const svg =

        '<svg xmlns="http://www.w3.org/2000/svg" ' +

          'width="32" height="32">' +

          '<circle ' +

            'cx="16" ' +

            'cy="16" ' +

            'r="9" ' +

            'fill="#4285F4" ' +

            'stroke="white" ' +

            'stroke-width="3"/>' +

          '<circle ' +

            'cx="16" ' +

            'cy="16" ' +

            'r="3" ' +

            'fill="white"/>' +

        '</svg>';


      userLocationMarker =
        new google.maps.Marker({

          position:
            userPosition,

          map:
            map,

          title:
            'My Location',

/*************************************************
 * GOOGLE AREA AUTOCOMPLETE - NEW PLACES API
 *************************************************/

async function setupAreaAutocomplete() {

  const input =
    document.getElementById(
      'editAreaName'
    );

  if (!input) {
    return;
  }


  const status =
    document.getElementById(
      'areaGoogleStatus'
    );


  if (
    !window.google ||
    !google.maps
  ) {

    if (status) {

      status.textContent =
        'Google Maps is not available.';

      status.style.color =
        '#dc3545';

    }

    return;

  }


  /*
   * Load the NEW Places library.
   */

  let places;

  try {

    places =
      await google.maps.importLibrary(
        'places'
      );

  } catch (error) {

    console.error(
      'Places library error:',
      error
    );

    if (status) {

      status.textContent =
        'Unable to load Google Places.';

      status.style.color =
        '#dc3545';

    }

    return;

  }


  const AutocompleteSuggestion =
    places.AutocompleteSuggestion;

  const AutocompleteSessionToken =
    places.AutocompleteSessionToken;


  if (
    !AutocompleteSuggestion ||
    !AutocompleteSessionToken
  ) {

    if (status) {

      status.textContent =
        'Google Places Autocomplete is unavailable.';

      status.style.color =
        '#dc3545';

    }

    return;

  }


  /*
   * Create dropdown.
   */

  let dropdown =
    document.getElementById(
      'areaGoogleSuggestions'
    );


  if (dropdown) {

    dropdown.remove();

  }


  dropdown =
    document.createElement(
      'div'
    );


  dropdown.id =
    'areaGoogleSuggestions';


  dropdown.style.cssText =

    'position:absolute;' +
    'left:0;' +
    'right:0;' +
    'top:100%;' +
    'background:#fff;' +
    'border:1px solid #ddd;' +
    'border-top:0;' +
    'border-radius:0 0 6px 6px;' +
    'box-shadow:0 4px 12px rgba(0,0,0,.15);' +
    'z-index:1000001;' +
    'max-height:260px;' +
    'overflow-y:auto;' +
    'display:none;';


  /*
   * Put dropdown relative to input.
   */

  const parent =
    input.parentElement;


  if (parent) {

    parent.style.position =
      'relative';

    parent.appendChild(
      dropdown
    );

  }


  /*
   * New autocomplete session.
   */

  let sessionToken =
    new AutocompleteSessionToken();


  let requestId =
    0;


  /*
   * Search while typing.
   */

  input.addEventListener(
    'input',
    async function() {

      const query =
        input.value.trim();


      requestId++;

      const currentRequestId =
        requestId;


      dropdown.innerHTML =
        '';


      dropdown.style.display =
        'none';


      if (!query) {

        if (status) {

          status.textContent =
            'Type and select a location from Google Maps.';

          status.style.color =
            '#666';

        }

        return;

      }


      if (status) {

        status.textContent =
          'Searching Google Maps...';

        status.style.color =
          '#666';

      }


      try {

        const request = {

          input:
            query,

          includedRegionCodes:
            ['in'],

          language:
            'en',

          region:
            'in',

          sessionToken:
            sessionToken,

          locationBias: {

            center: {

              lat:
                12.9716,

              lng:
                77.5946

            },

            radius:
              50000

          }

        };


        const result =
          await AutocompleteSuggestion
            .fetchAutocompleteSuggestions(
              request
            );


        /*
         * Ignore old search results.
         */

        if (
          currentRequestId !==
          requestId
        ) {

          return;

        }


        const suggestions =
          result.suggestions ||
          [];


        dropdown.innerHTML =
          '';


        if (!suggestions.length) {

          dropdown.style.display =
            'none';


          if (status) {

            status.textContent =
              'No Google Maps locations found.';

          }

          return;

        }


        /*
         * Show suggestions.
         */

        suggestions.forEach(
          function(suggestion) {

            const prediction =
              suggestion.placePrediction;


            if (!prediction) {

              return;

            }


            const button =
              document.createElement(
                'button'
              );


            button.type =
              'button';


            button.style.cssText =

              'display:block;' +
              'width:100%;' +
              'padding:10px 12px;' +
              'border:0;' +
              'border-bottom:1px solid #eee;' +
              'background:#fff;' +
              'text-align:left;' +
              'cursor:pointer;' +
              'font-size:13px;' +
              'color:#222;';


            const mainText =
              prediction.mainText
                ? prediction.mainText.text
                : prediction.text
                    .toString();


            const secondaryText =
              prediction.secondaryText
                ? prediction.secondaryText.text
                : '';


            button.innerHTML =

              '<div style="' +
                'font-weight:600;' +
              '">' +

                escapeHtml(
                  mainText
                ) +

              '</div>' +

              (
                secondaryText

                  ? '<div style="' +
                      'font-size:11px;' +
                      'color:#777;' +
                      'margin-top:2px;' +
                    '">' +

                      escapeHtml(
                        secondaryText
                      ) +

                    '</div>'

                  : ''

              );


            button.addEventListener(
              'mouseenter',
              function() {

                button.style.background =
                  '#f5f5f5';

              }
            );


            button.addEventListener(
              'mouseleave',
              function() {

                button.style.background =
                  '#fff';

              }
            );


            button.addEventListener(
              'mousedown',
              function(event) {

                /*
                 * Prevent input blur
                 * before click.
                 */

                event.preventDefault();

              }
            );


            button.addEventListener(
              'click',
              async function() {

                await selectGoogleAreaPlace(
                  prediction,
                  input,
                  dropdown,
                  status
                );


                /*
                 * New session after
                 * selection.
                 */

                sessionToken =
                  new AutocompleteSessionToken();

              }
            );


            dropdown.appendChild(
              button
            );

          }
        );


        dropdown.style.display =
          'block';


        if (status) {

          status.textContent =
            'Select the correct Google Maps location.';

          status.style.color =
            '#666';

        }

      } catch (error) {
  console.error('Google Places search error:', error);

  dropdown.style.display = 'none';

  let message = 'Google Places search failed.';

  if (error && error.message) {
    message += ' ' + error.message;
  }

  if (status) {
    status.textContent = message;
    status.style.color = '#dc3545';
  }
}

    }
  );


  /*
   * Hide dropdown when clicking elsewhere.
   */

  document.addEventListener(
    'click',
    function(event) {

      if (
        event.target !== input &&
        !dropdown.contains(
          event.target
        )
      ) {

        dropdown.style.display =
          'none';

      }

    }
  );

}


/*************************************************
 * SELECT GOOGLE AREA
 *************************************************/

async function selectGoogleAreaPlace(
  prediction,
  input,
  dropdown,
  status
) {

  if (!prediction) {

    return;

  }


  try {

    if (status) {

      status.textContent =
        'Loading Google Maps location...';

      status.style.color =
        '#666';

    }


    /*
     * Convert prediction to Place.
     */

    const place =
      prediction.toPlace();


    /*
     * Request only the fields
     * we actually need.
     */

    await place.fetchFields({

      fields: [

        'displayName',

        'formattedAddress',

        'location',

        'addressComponents'

      ]

    });


    if (
      !place.location
    ) {

      throw new Error(
        'Google Maps did not return coordinates.'
      );

    }


    /*
     * --------------------------------------
     * INDUSTRIAL AREA
     * --------------------------------------
     */

    const areaInput =
      document.getElementById(
        'editAreaName'
      );


    if (areaInput) {

      areaInput.value =
        place.displayName ||
        input.value;

    }


    /*
     * --------------------------------------
     * LATITUDE
     * --------------------------------------
     */

    const latitudeInput =
      document.getElementById(
        'editAreaLatitude'
      );


    if (latitudeInput) {

      latitudeInput.value =
        Number(
          place.location.lat()
        ).toFixed(6);

    }


    /*
     * --------------------------------------
     * LONGITUDE
     * --------------------------------------
     */

    const longitudeInput =
      document.getElementById(
        'editAreaLongitude'
      );


    if (longitudeInput) {

      longitudeInput.value =
        Number(
          place.location.lng()
        ).toFixed(6);

    }


    /*
     * --------------------------------------
     * CITY
     * --------------------------------------
     */

    let city =
      '';


    const components =
      place.addressComponents ||
      [];


    components.forEach(
      function(component) {

        const types =
          component.types ||
          [];


        if (
          !city &&
          types.indexOf(
            'locality'
          ) !== -1
        ) {

          city =
            component.longText ||
            component.shortText ||
            '';

        }


        if (
          !city &&
          types.indexOf(
            'administrative_area_level_2'
          ) !== -1
        ) {

          city =
            component.longText ||
            component.shortText ||
            '';

        }

      }
    );


    const cityInput =
      document.getElementById(
        'editAreaCity'
      );


    if (
      cityInput &&
      city
    ) {

      cityInput.value =
        city;

    }


    /*
     * Hide dropdown.
     */

    dropdown.style.display =
      'none';


    /*
     * Move map.
     */

    if (map) {

      const position = {

        lat:
          Number(
            place.location.lat()
          ),

        lng:
          Number(
            place.location.lng()
          )

      };


      map.panTo(
        position
      );


      map.setZoom(
        15
      );

    }


    /*
     * Success message.
     */

    if (status) {

      status.textContent =
        '✓ Google Maps location selected';

      status.style.color =
        '#198754';

    }

  } catch (error) {

    console.error(
      'Google Place selection error:',
      error
    );


    if (status) {

      status.textContent =
        'Unable to load the selected Google Maps location.';

      status.style.color =
        '#dc3545';

    }

  }

}

/*************************************************

 *************************************************/

function saveArea() {

  if (!activeArea) {

    alert(
      'No Industrial Area selected.'
    );

    return;

  }


  const data = {

    industrialArea:
      document
        .getElementById(
          'editAreaName'
        )
        .value
        .trim(),

    city:
      document
        .getElementById(
          'editAreaCity'
        )
        .value
        .trim(),

    latitude:
      document
        .getElementById(
          'editAreaLatitude'
        )
        .value
        .trim(),

    longitude:
      document
        .getElementById(
          'editAreaLongitude'
        )
        .value
        .trim()

  };


  if (!data.industrialArea) {

    alert(
      'Industrial Area is required.'
    );

    return;

  }


  if (!data.city) {

    alert(
      'City is required.'
    );

    return;

  }


  if (
    data.latitude === '' ||
    isNaN(
      Number(
        data.latitude
      )
    )
  ) {

    alert(
      'Please enter a valid Latitude.'
    );

    return;

  }


  if (
    data.longitude === '' ||
    isNaN(
      Number(
        data.longitude
      )
    )
  ) {

    alert(
      'Please enter a valid Longitude.'
    );

    return;

  }


  const button =
    document.getElementById(
      'editSaveButton'
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      'Saving...';

  }


  const oldAreaName =
    activeArea.industrialArea;


  google.script.run

    .withSuccessHandler(
      function() {

        activeArea.industrialArea =
          data.industrialArea;

        activeArea.city =
          data.city;

        activeArea.latitude =
          Number(
            data.latitude
          );

        activeArea.longitude =
          Number(
            data.longitude
          );


        if (
          activeAreaIndex >= 0
        ) {

          areas[
            activeAreaIndex
          ] =
            activeArea;

        }


        closeEditModal();


        const selectedAreaName =
          document.getElementById(
            'selectedAreaName'
          );


        if (selectedAreaName) {

          selectedAreaName.textContent =
            activeArea.industrialArea;

          addAreaEditButton(
            selectedAreaName
          );

        }


        const selectedAreaCity =
          document.getElementById(
            'selectedAreaCity'
          );


        if (selectedAreaCity) {

          selectedAreaCity.textContent =
            activeArea.city +
            ' · ' +
            customers.length +
            ' Customers';

        }


        renderAreaMarkers();


        /*
         * Refresh the customer list
         * using the new area name.
         */

        loadCustomersByArea(
          activeArea.industrialArea
        );

      }
    )

    .withFailureHandler(
      function(error) {

        if (button) {

          button.disabled =
            false;

          button.textContent =
            'Save';

        }


        alert(
          getErrorMessage(error)
        );

      }
    )

    .updateAreaRecord(
      activeArea.rowNumber,
      data
    );

}

/*************************************************
 * GET FIELD
 *************************************************/

function getField(
  obj,
  possibleNames
) {

  if (!obj) {

    return '';

  }


  const keys =
    Object.keys(obj);


  for (
    let i = 0;
    i < possibleNames.length;
    i++
  ) {

    const wanted =
      String(
        possibleNames[i]
      )
      .trim()
      .toLowerCase()
      .replace(
        /[\s_-]+/g,
        ''
      );


    for (
      let j = 0;
      j < keys.length;
      j++
    ) {

      const actual =
        String(
          keys[j]
        )
        .trim()
        .toLowerCase()
        .replace(
          /[\s_-]+/g,
          ''
        );


      if (
        actual === wanted
      ) {

        const value =
          obj[
            keys[j]
          ];


        if (
          value === undefined ||
          value === null
        ) {

          return '';

        }


        return value;

      }

    }

  }


  return '';

}

function customerInfoItem(

        escapeHtml(

/*************************************************
 * FORMAT POTENTIAL
 *************************************************/

function formatPotential(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '-';

  }


  const number =
    Number(
      String(value)
        .replace(
          /,/g,
          ''
        )
        .replace(
          /₹/g,
          ''
        )
    );


  if (!isNaN(number)) {

    return '₹' +
      number.toLocaleString(
        'en-IN'
      );

  }


  return String(value);

}

function toggleVisitingCard(
  button
) {

  if (!button) {

  const preview =
    button.nextElementSibling;


  if (!preview) {

    return;

  }


  if (
    preview.classList.contains(
      'hidden'
    )
  ) {

    preview.classList.remove(
      'hidden'
    );


    button.textContent =
      'Hide Visiting Card';

  } else {

    preview.classList.add(
      'hidden'
    );


    button.textContent =
      'View Visiting Card';

  }

}

/*************************************************

function openEditModal(
  title,
  content,
  saveFunction
) {

  let modal =
    document.getElementById(
      'editModal'
    );


  if (!modal) {

    modal =
      document.createElement(
        'div'
      );


    modal.id =
      'editModal';


    modal.className =
      'edit-modal';


    document.body.appendChild(
      modal
    );

  }


  modal.innerHTML =

    '<div class="edit-modal-box">' +

      '<div class="edit-modal-header" ' +
        'style="cursor:move;">' +

        '<div class="edit-modal-title">' +

          escapeHtml(
            title
          ) +

        '</div>' +

        '<button ' +

          'class="modal-close" ' +

          'type="button" ' +

          'onclick="closeEditModal()">' +

          '×' +

        '</button>' +

      '</div>' +


      '<div class="edit-modal-body">' +

        content +

      '</div>' +


      '<div class="edit-modal-footer">' +

        '<button ' +

          'class="cancel-button" ' +

          'type="button" ' +

          'onclick="closeEditModal()">' +

          'Cancel' +

        '</button>' +


        '<button ' +

          'class="save-button" ' +

          'id="editSaveButton" ' +

          'type="button">' +

          'Save' +

        '</button>' +

      '</div>' +

    '</div>';


  modal
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'editSaveButton'
    )
    .onclick =
    saveFunction;


  /*
   * MAKE MODAL DRAGGABLE
   */

  const box =
    modal.querySelector(
      '.edit-modal-box'
    );


  const header =
    modal.querySelector(
      '.edit-modal-header'
    );


  if (!box || !header) {
    return;
  }


  /*
   * Start position
   */

  box.style.position =
    'fixed';


  box.style.margin =
    '0';


  /*
   * Keep normal centered position
   * when first opened
   */

  const rect =
    box.getBoundingClientRect();


  box.style.left =
    rect.left + 'px';


  box.style.top =
    rect.top + 'px';


  /*
   * Drag variables
   */

  let dragging = false;

  let startX = 0;

  let startY = 0;

  let startLeft = 0;

  let startTop = 0;


  header.addEventListener(
    'mousedown',
    function(event) {

      /*
       * Do not start dragging
       * when clicking close button
       */

      if (
        event.target.closest(
          '.modal-close'
        )
      ) {
        return;
      }


      dragging = true;


      startX =
        event.clientX;


      startY =
        event.clientY;


      startLeft =
        parseFloat(
          box.style.left
        ) || 0;


      startTop =
        parseFloat(
          box.style.top
        ) || 0;


      header.style.cursor =
        'grabbing';


      document.body.style.userSelect =
        'none';

    }
  );


  document.addEventListener(
    'mousemove',
    function(event) {

      if (!dragging) {
        return;
      }


      let newLeft =
        startLeft +
        (
          event.clientX -
          startX
        );


      let newTop =
        startTop +
        (
          event.clientY -
          startY
        );


      /*
       * Keep part of the window
       * inside the screen
       */

      const boxWidth =
        box.offsetWidth;


      const boxHeight =
        box.offsetHeight;


      const minVisible =
        40;


      const maxLeft =
        window.innerWidth -
        minVisible;


      const maxTop =
        window.innerHeight -
        minVisible;


      newLeft =
        Math.max(
          -(boxWidth - minVisible),
          Math.min(
            newLeft,
            maxLeft
          )
        );


      newTop =
        Math.max(
          0,
          Math.min(
            newTop,
            maxTop
          )
        );


      box.style.left =
        newLeft + 'px';


      box.style.top =
        newTop + 'px';

    }
  );


  document.addEventListener(
    'mouseup',
    function() {

      if (!dragging) {
        return;
      }


      dragging = false;


      header.style.cursor =
        'move';


      document.body.style.userSelect =
        '';

    }
  );

}

 * SAVE PERSON
 *************************************************/

function savePerson() {

  const peopleId =
    document
      .getElementById(
        'editPeopleId'
      )
      .value
      .trim();


  const companyId =
    getField(
      activeCustomer,
      [
        'companyId',
        'Company ID'
      ]
    );


  const name =
    document
      .getElementById(
        'editPersonName'
      )
      .value
      .trim();


  const designation =
    document
      .getElementById(
        'editPersonDesignation'
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        'editPersonPhone'
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        'editPersonEmail'
      )
      .value
      .trim();


  const existingPhoto =
    document
      .getElementById(
        'editPersonPhoto'
      )
      .value
      .trim();


  const fileInput =
    document.getElementById(
      'editPersonPhotoFile'
    );


  const file =
    fileInput &&
    fileInput.files &&
    fileInput.files.length
      ? fileInput.files[0]
      : null;


  const button =
    document.getElementById(
      'editSaveButton'
    );


  button.disabled =
    true;

  button.textContent =
    'Saving...';


  const data = {

    name:
      name,

    designation:
      designation,

    phone:
      phone,

    email:
      email,

    photo:
      existingPhoto,

    photoFile:
      null

  };


  if (!file) {

    sendPersonToServer(
      peopleId,
      companyId,
      data,
      button
    );

    return;

  }


  if (
    !file.type ||
    !file.type.startsWith(
      'image/'
    )
  ) {

    button.disabled =
      false;

    button.textContent =
      'Save';

    alert(
      'Please select an image file.'
    );

    return;

  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    button.disabled =
      false;

    button.textContent =
      'Save';

    alert(
      'Visiting card image must be 5 MB or smaller.'
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function() {

      const result =
        String(
          reader.result
        );


      const base64 =
        result.split(',')[1];


      data.photoFile = {

        fileName:
          file.name,

        mimeType:
          file.type,

        base64:
          base64

      };


      sendPersonToServer(
        peopleId,
        companyId,
        data,
        button
      );

    };


  reader.onerror =
    function() {

      button.disabled =
        false;

      button.textContent =
        'Save';

      alert(
        'Unable to read the image.'
      );

    };


  reader.readAsDataURL(
    file
  );

}

/*************************************************
 * LOAD SETTINGS OPTIONS
 *
 * Industrial Area is obtained
 * from Areas sheet, not Settings.
 *************************************************/

function loadSettingsOptions(
  callback
) {

  if (settingsOptions) {

    callback(
      settingsOptions
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(data) {

        settingsOptions =
          data || {};


        /*
         * Industrial Area master list
         * comes directly from Areas.
         */

        google.script.run

          .withSuccessHandler(
            function(areaData) {

              settingsOptions[
                'Industrial Area'
              ] =
                (areaData || [])
                  .map(
                    function(area) {

                      return area
                        .industrialArea;

                    }
                  );


              callback(
                settingsOptions
              );

            }
          )

          .withFailureHandler(
            function() {

              settingsOptions[
                'Industrial Area'
              ] =
                [];


              callback(
                settingsOptions
              );

            }
          )

          .getIndustrialAreas();

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          'Settings error:',
          error
        );


        settingsOptions =
          {};


        callback(
          settingsOptions
        );

      }
    )

    .getSettingsOptions();

}


/*************************************************
 * CREATE SELECT
 *************************************************/

function createSelectHtml(
  id,
  label,
  options,
  selectedValue
) {

  options =
    options || [];


  /*
   * Make unique values.
   */

  options =
    Array.from(
      new Set(
        options
      )
    );


  /*
   * If current value isn't
   * in the master list, retain it.
   */

  if (
    selectedValue &&
    options.indexOf(
      selectedValue
    ) === -1
  ) {

    options.unshift(
      selectedValue
    );

  }


  let html =

    '<div class="edit-field">' +

      '<label>' +

        escapeHtml(
          label
        ) +

      '</label>' +

      '<select id="' +

        escapeAttribute(
          id
        ) +

      '">';


  html +=

    '<option value="">' +

      'Select ' +

      escapeHtml(
        label
      ) +

    '</option>';


  options.forEach(
    function(option) {

      const selected =
        String(option) ===
        String(
          selectedValue || ''
        )

          ? ' selected'

          : '';


      html +=

        '<option ' +

          'value="' +

            escapeAttribute(
              option
            ) +

          '"' +

          selected +

        '>' +

          escapeHtml(
            option
          ) +

        '</option>';

    }
  );


  html +=

      '</select>' +

    '</div>';


  return html;

}

/*************************************************
 * NORMALIZE URL
 *************************************************/

function normalizeUrl(
  url
) {

  let value =
    String(
      url || ''
    ).trim();


  if (!value) {

    return '';

  }


  if (
    !/^https?:\/\//i.test(
      value
    )
  ) {

    value =
      'https://' +
      value;

  }


  return value;

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * ESCAPE ATTRIBUTE
 *************************************************/

function escapeAttribute(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    );

}


/*************************************************
 * ERROR MESSAGE
 *************************************************/

function getErrorMessage(
  error
) {

  if (!error) {

    return 'Unknown error.';

  }


  if (
    typeof error ===
    'string'
  ) {

    return error;

  }


  return (

    error.message ||

    'Unknown error.'

  );

}

/*************************************************
 * UNIVERSAL SEARCH
 *************************************************/

function setupUniversalSearch() {

  const input =
    document.getElementById(
      'universalSearch'
    );


  const clear =
    document.getElementById(
      'universalSearchClear'
    );


  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (
    !input ||
    !clear ||
    !results
  ) {

    return;

  }


  let timer =
    null;


  input.addEventListener(
    'input',
    function() {

      const query =
        input.value.trim();


      clear.classList.toggle(
        'hidden',
        !query
      );


      clearTimeout(
        timer
      );


      if (!query) {

        results.innerHTML =
          '';

        results.classList.add(
          'hidden'
        );

        return;

      }


      timer =
        setTimeout(
          function() {

            performUniversalSearch(
              query
            );

          },
          250
        );

    }
  );


  clear.addEventListener(
    'click',
    function() {

      clearUniversalSearch();

      input.focus();

    }
  );


  document.addEventListener(
    'click',
    function(event) {

      const searchBox =
        document.querySelector(
          '.universal-search'
        );


      if (
        searchBox &&
        !searchBox.contains(
          event.target
        )
      ) {

        results.classList.add(
          'hidden'
        );

      }

    }
  );

}


/*************************************************
 * PERFORM UNIVERSAL SEARCH
 *************************************************/

function performUniversalSearch(
  query
) {

  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (!results) {

    return;

  }


  results.classList.remove(
    'hidden'
  );


  results.innerHTML =

    '<div class="universal-search-message">' +

      'Searching...' +

    '</div>';


  google.script.run

    .withSuccessHandler(
      function(data) {

        renderUniversalSearchResults(
          data || []
        );

      }
    )

    .withFailureHandler(
      function(error) {

        results.innerHTML =

          '<div class="universal-search-message">' +

            escapeHtml(
              getErrorMessage(
                error
              )
            ) +

          '</div>';

      }
    )

    .universalSearch(
      query
    );

}


/*************************************************
 * RENDER SEARCH RESULTS
 *************************************************/

function renderUniversalSearchResults(
  data
) {

  const results =
    document.getElementById(
      'universalSearchResults'
    );


  if (!results) {

    return;

  }


  results.innerHTML =
    '';


  if (
    !data ||
    !data.length
  ) {

    results.innerHTML =

      '<div class="universal-search-message">' +

        'No results found.' +

      '</div>';


    results.classList.remove(
      'hidden'
    );


    return;

  }


  data.forEach(
    function(item) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'universal-search-result';


      let icon =
        '';


      let title =
        '';


      let meta =
        '';


      /*
       * INDUSTRIAL AREA
       */

      if (
        item.type ===
        'area'
      ) {

        icon =
          'A';


        title =
          item.name ||
          item.industrialArea ||
          '';


        meta =
          'Industrial Area · ' +
          (
            item.city ||
            ''
          );

      }


      /*
       * CUSTOMER
       */

      else if (
        item.type ===
        'customer'
      ) {

        icon =
          'C';


        title =
          item.name ||
          '';


        meta =
          'Customer · ' +
          (
            item.industrialArea ||
            ''
          ) +
          (
            item.city
              ? ' · ' +
                item.city
              : ''
          );

      }


      /*
       * PERSON
       */

      else if (
        item.type ===
        'person'
      ) {

        icon =
          'P';


        title =
          item.name ||
          '';


        meta =
          'Contact · ' +
          (
            item.company ||
            ''
          ) +
          (
            item.designation
              ? ' · ' +
                item.designation
              : ''
          );

      }


      button.innerHTML =

        '<span class="search-result-icon">' +

          escapeHtml(
            icon
          ) +

        '</span>' +

        '<span class="search-result-text">' +

          '<span class="search-result-title">' +

            escapeHtml(
              title ||
              '-'
            ) +

          '</span>' +

          '<span class="search-result-meta">' +

            escapeHtml(
              meta
            ) +

          '</span>' +

        '</span>';


      button.addEventListener(
        'click',
        function() {

          hideUniversalSearchResults();

          openUniversalSearchResult(
            item
          );

        }
      );


      results.appendChild(
        button
      );

    }
  );


  results.classList.remove(
    'hidden'
  );

}

 * HIDE SEARCH RESULTS
 *************************************************/

function hideUniversalSearchResults() {

  const results =
    document.getElementById(

  if (results) {

    results.classList.add(

    );

/*************************************************
 * OPEN SEARCH RESULT
 *************************************************/

function openUniversalSearchResult(
  item
) {

  if (!item) {

    return;

  }


  /*
   * INDUSTRIAL AREA
   */

  if (
    item.type ===
    'area'
  ) {

    const index =
      areas.findIndex(
        function(area) {

          return String(
            area.industrialArea ||
            ''
          )
          .trim()
          .toLowerCase() ===

          String(
            item.industrialArea ||
            item.name ||
            ''
          )
          .trim()
          .toLowerCase();

        }
      );


    if (
      index !== -1
    ) {

      selectArea(
        index
      );

    }


    return;

  }


  /*
   * CUSTOMER
   */

  if (
    item.type ===
    'customer'
  ) {

    openSearchCustomer(
      item
    );

    return;

  }


  /*
   * PERSON
   */

  if (
    item.type ===
    'person'
  ) {

    openSearchPerson(
      item
    );

  }

}


/*************************************************
 * OPEN SEARCH CUSTOMER
 *************************************************/

function openSearchCustomer(
  item
) {

  const areaName =
    item.industrialArea ||
    '';


  google.script.run

    .withSuccessHandler(
      function(data) {

        customers =
          data || [];


        const index =
          customers.findIndex(
            function(customer) {

              return String(
                getField(
                  customer,
                  [
                    'companyId',
                    'Company ID'
                  ]
                )
              )
              .trim() ===

              String(
                item.companyId
              )
              .trim();

            }
          );


        if (
          index === -1
        ) {

          showError(
            'Customer not found.'
          );

          return;

        }


        activeArea =
          areas.find(
            function(area) {

              return String(
                area.industrialArea ||
                ''
              )
              .trim()
              .toLowerCase() ===

              String(
                areaName
              )
              .trim()
              .toLowerCase();

            }
          ) || null;


        if (activeArea) {

          activeAreaIndex =
            areas.indexOf(
              activeArea
            );

        }


        customerListMode =
          'area';


        showCustomerView();

        renderCustomerList();

        selectCustomer(
          index
        );

      }
    )

    .withFailureHandler(
      function(error) {

        showError(
          getErrorMessage(
            error
          )
        );

      }
    )

    .getCustomersByArea(
      areaName
    );

}


/*************************************************
 * OPEN SEARCH PERSON
 *************************************************/

function openSearchPerson(
  item
) {

  google.script.run

    .withSuccessHandler(
      function(customer) {

        if (!customer) {

          showError(
            'Customer for this contact was not found.'
          );

          return;

        }


        activeCustomer =
          customer;


        activeArea =
          areas.find(
            function(area) {

              return String(
                area.industrialArea ||
                ''
              )
              .trim()
              .toLowerCase() ===

              String(
                item.industrialArea ||
                ''
              )
              .trim()
              .toLowerCase();

            }
          ) || null;


        if (activeArea) {

          activeAreaIndex =
            areas.indexOf(
              activeArea
            );

        }


        customerListMode =
          'area';


        renderCustomerDetail();

        showDetailView();

      }
    )

    .withFailureHandler(
      function(error) {

        showError(
          getErrorMessage(
            error
          )
        );

      }
    )

    .getCustomerById(
      item.companyId
    );

}

/*************************************************

 *************************************************/

function closeSettings() {

  const modal =
    document.getElementById(
      'settingsModal'
    );


  if (modal) {

    modal.style.display =

}


/*************************************************

function openSettingList(

/*************************************************
 * RENDER SETTING VALUES
 *************************************************/

function renderSettingValues(
  settingName,
  list
) {

  const container =
    document.getElementById(
      'settingValuesList'
    );


  if (!container) {

    return;

  }


  if (!list.length) {

    container.innerHTML =

      '<div style="' +

        'padding:30px 10px;' +

        'text-align:center;' +

        'color:#777;' +

      '">' +

        'No values available.' +

      '</div>';


    return;

  }


  container.innerHTML =
    '';


  list.forEach(
    function(value) {

      const row =
        document.createElement(
          'div'
        );


      row.style.cssText =
        'display:flex;' +
        'align-items:center;' +
        'gap:8px;' +
        'padding:10px 0;' +
        'border-bottom:1px solid #eee;';


      const text =
        document.createElement(
          'div'
        );


      text.textContent =
        value;


      text.style.cssText =
        'flex:1;font-size:14px;color:#222;';


      const edit =
        document.createElement(
          'button'
        );


      edit.type =
        'button';


      edit.textContent =
        'Edit';


      edit.style.cssText =
        'border:1px solid #198754;' +
        'color:#198754;' +
        'background:white;' +
        'border-radius:5px;' +
        'padding:5px 10px;' +
        'cursor:pointer;';


      edit.addEventListener(
        'click',
        function() {

          editSettingItem(

            value
          );

        }
      );


      const remove =
        document.createElement(
          'button'
        );


      remove.type =
        'button';


      remove.textContent =

      remove.style.cssText =

        'color:#dc3545;' +
        'background:white;' +
        'border-radius:5px;' +
        'padding:5px 10px;' +

          );

        }
      );


      row.appendChild(
        text
      );


      row.appendChild(
        edit
      );


      row.appendChild(
        remove
      );


      container.appendChild(
        row
      );

    }
  );

}


/*************************************************
 * ADD SETTING
 *************************************************/

function addSettingItem(
  settingName
) {

  const value =
    prompt(
      'Enter new ' +
      settingName +
      ':'
    );


  if (value === null) {

    return;

  }


  const cleanValue =
    value.trim();


  if (!cleanValue) {

    alert(
      'Please enter a value.'
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        settingsOptions =
          null;


        openSettingList(
          settingName
        );

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          getErrorMessage(
            error
          )
        );

      }
    )

    .addSettingValue(
      settingName,
      cleanValue
    );

}


/*************************************************
 * EDIT SETTING
 *************************************************/

function editSettingItem(
  settingName,
  oldValue
) {

  const newValue =
    prompt(
      'Edit ' +
      settingName +
      ':',
      oldValue
    );


  if (newValue === null) {

    return;

  }


  const cleanValue =
    newValue.trim();


  if (!cleanValue) {

    alert(
      'Please enter a value.'
    );

    return;

  }


  if (
    cleanValue ===
    oldValue
  ) {

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        settingsOptions =
          null;


        openSettingList(
          settingName
        );

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          getErrorMessage(
            error
          )
        );

      }
    )

    .updateSettingValue(
      settingName,
      oldValue,
      cleanValue
    );

}


/*************************************************
 * DELETE SETTING
 *************************************************/

function deleteSettingItem(
  settingName,
  value
) {

  const confirmed =
    confirm(
      'Delete "' +
      value +
      '" from ' +
      settingName +
      '?'
    );


  if (!confirmed) {

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        settingsOptions =
          null;


        openSettingList(
          settingName
        );

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          getErrorMessage(
            error
          )
        );

      }
    )

    .deleteSettingValue(
      settingName,
      value
    );

}

/*************************************************
 * ALL CUSTOMERS
 *************************************************/

function openAllCustomers() {

  customerListMode =
    'all';


  const panel =
    document.getElementById(
      'allCustomersView'
    );


  const loading =
    document.getElementById(
      'allCustomerLoading'
    );


  const list =
    document.getElementById(
      'allCustomerList'
    );


  const count =
    document.getElementById(
      'allCustomerCount'
    );


  if (!panel || !list) {

    return;

  }


  document
    .getElementById(
      'customerView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'detailView'
    )
    .classList.add(
      'hidden'
    );


  panel.classList.remove(
    'hidden'
  );


  if (loading) {

    loading.classList.remove(
      'hidden'
    );

  }


  list.innerHTML =
    '';


  if (count) {

    count.textContent =
      'Loading...';

  }


  const search =
    document.getElementById(
      'allCustomerSearch'
    );


  if (search) {

    search.value =
      '';

  }


  google.script.run

    .withSuccessHandler(
      function(data) {

        allCustomers =
          data || [];


        if (loading) {

          loading.classList.add(
            'hidden'
          );

        }


        if (count) {

          count.textContent =
            allCustomers.length +
            ' Customers';

        }


        renderAllCustomers();

      }
    )

    .withFailureHandler(
      function(error) {

        if (loading) {

          loading.classList.add(
            'hidden'
          );

        }


        list.innerHTML =

          '<div class="loading">' +

            escapeHtml(
              getErrorMessage(
                error
              )
            ) +

          '</div>';

      }
    )

    .getAllCustomers();

}


/*************************************************
 * RENDER ALL CUSTOMERS
 *************************************************/

function renderAllCustomers() {

  const list =
    document.getElementById(
      'allCustomerList'
    );


  if (!list) {

    return;

  }


  const searchInput =
    document.getElementById(
      'allCustomerSearch'
    );


  const query =
    searchInput

      ? searchInput.value
          .trim()
          .toLowerCase()

      : '';


  list.innerHTML =
    '';


  const filtered =
    allCustomers.filter(
      function(customer) {

        if (!query) {

          return true;

        }


        const text =
          [

            customer.companyId,

            customer.customerName,

            customer.industrialArea,

            customer.city,

            customer.type,

            customer.status,

            customer.potential,

            customer.website

          ]
          .join(' ')
          .toLowerCase();


        return text.indexOf(
          query
        ) !== -1;

      }
    );


  if (!filtered.length) {

    list.innerHTML =

      '<div class="loading">' +

        'No customers found.' +

      '</div>';


    return;

  }


  filtered.forEach(
    function(customer) {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'customer-item';


      item.innerHTML =

        '<div class="customer-name">' +

          escapeHtml(
            customer.customerName ||
            '-'
          ) +

        '</div>' +


        '<div class="customer-area">' +

          'Industrial Area: ' +

          escapeHtml(
            customer.industrialArea ||
            '-'
          ) +

        '</div>' +


        '<div class="customer-city">' +

          escapeHtml(
            customer.city ||
            ''
          ) +

        '</div>';


      item.addEventListener(
        'click',
        function() {

          openAllCustomerDetail(
            customer
          );

        }
      );


      list.appendChild(
        item
      );

    }
  );

}


/*************************************************
 * ALL CUSTOMER DETAIL
 *************************************************/

function openAllCustomerDetail(
  customer
) {

  activeCustomer =
    customer;


  activeArea =
    areas.find(
      function(area) {

        return String(
          area.industrialArea ||
          ''
        )
        .trim()
        .toLowerCase() ===

        String(
          customer.industrialArea ||
          ''
        )
        .trim()
        .toLowerCase();

      }
    ) || null;


  if (activeArea) {

    activeAreaIndex =
      areas.indexOf(
        activeArea
      );

  }


  document
    .getElementById(
      'allCustomersView'
    )
    .classList.add(
      'hidden'
    );


  renderCustomerDetail();

  showDetailView();

}


/*************************************************
 * ALL CUSTOMER SEARCH
 *************************************************/

function setupAllCustomerSearch() {

  const input =
    document.getElementById(
      'allCustomerSearch'
    );


  const clear =
    document.getElementById(
      'allCustomerSearchClear'
    );


  if (!input) {

    return;

  }


  input.addEventListener(
    'input',
    function() {

      const query =
        input.value.trim();


      if (clear) {

        clear.classList.toggle(
          'hidden',
          !query
        );

      }


      renderAllCustomers();

    }
  );


  if (clear) {

    clear.addEventListener(
      'click',
      function() {

        input.value =
          '';


        clear.classList.add(
          'hidden'
        );


        renderAllCustomers();

        input.focus();

      }
    );

  }

}
